[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "banc-branch-composition"
version = "0.2.0"
description = "Source-derived complete BANC branch interface with explicit data and native-source gaps"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["banc_composition"]
include-package-data = true

[tool.setuptools.package-data]
banc_composition = ["SOURCE_PINS.json", "_sources/**/*.py", "_sources/**/*.R", "PANEL_CONTRACT.json", "_primary/*.R"]
