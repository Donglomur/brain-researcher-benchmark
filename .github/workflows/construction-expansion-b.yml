                  "sha256": "e4bd7c76badb7b65a60a4c827db2a352bb932d304cac5ed4d39c75f97990c71f"
              },
              {
                  "path": "benchmarks/paper/PAPER-paper-signal-add-019/implementations/initial-evaluator-v1/evaluator.py",
                  "bytes": 25780,
                  "sha256": "2cbfa3be223cdef714619c2db287bb77de0833c40f9c0c7e20044e6cc272e9f9"
              },
              {
                  "path": "benchmarks/paper/PAPER-paper-signal-add-019/implementations/initial-evaluator-v1/tests/test_evaluator.py",
                  "bytes": 12568,
                  "sha256": "661a89ffc8f54f6fed5153fc8be4b9233cc3fec8bed43c4e462d7d5f8638195b"
              }
          ]
          packages = [
              "benchmarks/paper/PAPER-SCOPE-20261114-LATENTCIRCUIT/implementations/initial-evaluator-v1",
              "benchmarks/paper/PAPER-paper-method-013/implementations/initial-evaluator-v1",
              "benchmarks/paper/PAPER-paper-method-030/implementations/initial-evaluator-v1",
              "benchmarks/paper/PAPER-paper-method-042/implementations/initial-evaluator-v1",
              "benchmarks/paper/PAPER-paper-method-add-005/implementations/initial-evaluator-v1",
              "benchmarks/paper/PAPER-paper-method-replacement-006/implementations/initial-evaluator-v1",
              "benchmarks/paper/PAPER-paper-signal-add-005/implementations/initial-evaluator-v1",
              "benchmarks/paper/PAPER-paper-signal-add-019/implementations/initial-evaluator-v1"
          ]
          assert len(rows) == 55 > 0
          assert sum(row['bytes'] for row in rows) == 945556 <= 33554432
          expected = {}
          def path_for(relative, *, directory=False):
              p = PurePosixPath(relative)
              assert str(p) == relative and not p.is_absolute()
              assert '\\' not in relative and all(x not in ('', '.', '..') for x in relative.split('/'))
              current = root
              for part in p.parts:
                  current = current / part
                  assert not current.is_symlink(), relative
              info = current.lstat()
              assert stat.S_ISDIR(info.st_mode) if directory else stat.S_ISREG(info.st_mode), relative
              return current
          def stamp(info):
              return info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns, info.st_ctime_ns
          for row in rows:
              assert set(row) == {'path', 'bytes', 'sha256'}
              assert row['path'] not in expected
              assert type(row['bytes']) is int and 0 <= row['bytes'] <= 8388608
              assert len(row['sha256']) == 64 and set(row['sha256']) <= set('0123456789abcdef')
              path = path_for(row['path'])
              before = path.lstat()
              assert before.st_nlink == 1 and before.st_size == row['bytes'], row['path']
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              with os.fdopen(fd, 'rb') as stream:
                  opened = os.fstat(stream.fileno())
                  assert stamp(opened) == stamp(before)
                  body = stream.read(row['bytes'] + 1)
                  assert stamp(os.fstat(stream.fileno())) == stamp(opened)
              assert stamp(path_for(row['path']).lstat()) == stamp(before)
              assert len(body) == row['bytes'] and hashlib.sha256(body).hexdigest() == row['sha256'], row['path']
              expected[row['path']] = row
          for package in packages:
              path_for(package, directory=True)
              observed = set()
              for directory, directories, files in os.walk(root / package, followlinks=False):
                  for name in directories:
                      path_for((Path(directory) / name).relative_to(root).as_posix(), directory=True)
                  for name in files:
                      relative = (Path(directory) / name).relative_to(root).as_posix()
                      path_for(relative)
                      observed.add(relative)
              assert observed == {p for p in expected if p.startswith(package + '/')}, package
          print(json.dumps({'verified_source_files': len(expected), 'verified_bytes': 945556,
                            'complete_new_packages': len(packages), 'generated_controls_only': True,
                            'authentic_data_read': False, 'scientific_qualification': False}))
          PY
  expansion-b-neural-015:
    needs: expansion-b-source-identities
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.18'
      - name: Generated controls for NEURAL-015
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s python -I -S -B - <<'PY'
          import json
          import sys
          import unittest
          expected_ids = ['test_evaluator.AlignmentControls.test_cli_roundtrip_and_nonzero_rejection', 'test_evaluator.AlignmentControls.test_clock_failures_and_no_extrapolation', 'test_evaluator.AlignmentControls.test_inclusive_tolerance_union_and_no_event_matching', 'test_evaluator.AlignmentControls.test_json_duplicate_keys_and_nonfinite_are_rejected', 'test_evaluator.AlignmentControls.test_nearest_trigger_rounding_and_endpoints', 'test_evaluator.AlignmentControls.test_pause_clock_must_be_segmented_before_alignment', 'test_evaluator.CohortControls.test_entrant_cannot_supply_control_or_future_context', 'test_evaluator.CohortControls.test_full_path_population_macro_and_shift', 'test_evaluator.CohortControls.test_guard_shift_and_query_binding', 'test_evaluator.CohortControls.test_movie_and_person_leakage_rejected', 'test_evaluator.CohortControls.test_no_label_bearing_unknown_fields', 'test_evaluator.CohortControls.test_prediction_validation', 'test_evaluator.CohortControls.test_reference_and_test_coverage_cannot_be_reduced', 'test_evaluator.CohortControls.test_sign_reversed_shift_has_no_wrap', 'test_evaluator.CohortControls.test_submission_rejects_missing_duplicate_unknown_ids', 'test_evaluator.CohortControls.test_target_free_allowlist', 'test_evaluator.MetricControls.test_balanced_diagnostic_has_half_prevalence_null', 'test_evaluator.MetricControls.test_clipping_is_explicit_and_counted', 'test_evaluator.MetricControls.test_constant_null_is_prevalence', 'test_evaluator.MetricControls.test_incremental_loss_sign_and_exact_value', 'test_evaluator.MetricControls.test_independent_tie_reference_and_permutation', 'test_evaluator.MetricControls.test_macro_is_not_pooled_or_session_average', 'test_evaluator.MetricControls.test_undefined_ap_preserved_not_dropped']
          suite = unittest.defaultTestLoader.discover('benchmarks/neural/NEURAL-015/implementations/initial-evaluator-v1/tests', pattern='test_evaluator.py')
          def flatten(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from flatten(item)
                  else:
                      yield item
          actual_ids = sorted(case.id() for case in flatten(suite))
          assert actual_ids == expected_ids, (actual_ids, expected_ids)
          assert suite.countTestCases() == 23 > 0
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun == 23, result.testsRun
          assert not result.skipped, result.skipped
          assert not result.expectedFailures, result.expectedFailures
          assert not result.unexpectedSuccesses, result.unexpectedSuccesses
          print(json.dumps({'task': 'NEURAL-015', 'tests_run': result.testsRun,
                            'skipped': len(result.skipped), 'expected_failures': len(result.expectedFailures),
                            'generated_controls_only': True, 'scientific_qualification': False}))
          sys.exit(0 if result.wasSuccessful() else 1)
          PY

