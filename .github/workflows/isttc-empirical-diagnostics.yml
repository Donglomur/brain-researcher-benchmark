name: iSTTC empirical diagnostics source
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-preflight:
    uses: ./.github/workflows/source-maintenance-preflight.yml
  source-and-relocation:
    needs: source-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check complete generated support and relocated CLI
        timeout-minutes: 3
        run: python3 -I -S -B benchmarks/paper/PAPER-paper-method-add-004/implementations/empirical-diagnostics/test_public_package.py
