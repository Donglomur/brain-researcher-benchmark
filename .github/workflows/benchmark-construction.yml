name: Benchmark construction controls

on:
  pull_request:
    branches: [publish/neuroscience-200]
  push:
    branches: [publish/neuroscience-200]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-construction-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# These generated controls check source contracts and mathematical behavior.
# They do not run authentic datasets, models, or scientific qualification.
jobs:
  source-preflight:
    uses: ./.github/workflows/source-maintenance-preflight.yml
  helsinki-complete-support-controls:
    needs: source-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.18'
      - name: Check complete infant support, causal packets, and Brier metrics
        shell: bash
        run: |
          set -euo pipefail
          ulimit -t 60
          /usr/bin/timeout --signal=TERM --kill-after=5s 90s python -I -S -B -m unittest discover -s benchmarks/neural/NEURAL-EXP-005/implementations/complete-support-evaluator -p 'test_*.py' -v

  vestibular-condition-controls:
    needs: source-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.18'
      - name: Check paired support, equal-group weighting, and frozen priors
        shell: bash
        run: |
          set -euo pipefail
          ulimit -t 60
          /usr/bin/timeout --signal=TERM --kill-after=5s 90s python -I -S -B benchmarks/neural/NEURAL-DISC-20261114-VESTIBULAR-VO/implementations/condition-evaluator/test_evaluate.py -v

  laser-condition-packet-controls:
    needs: source-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.18'
      - name: Check full cohort construction, alias exclusion, and matched packets
        shell: bash
        run: |
          set -euo pipefail
          ulimit -t 60
          /usr/bin/timeout --signal=TERM --kill-after=5s 90s python -I -S -B benchmarks/neural/NEURAL-SCOPE-20261114-LASER-EEG-REPORT/implementations/condition-packets/test_packets.py

  isttc-empirical-estimation-controls:
    needs: source-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.18'
      - name: Check four-estimator protocol and complete generated fit support
        shell: bash
        run: |
          set -euo pipefail
          ulimit -t 60
          /usr/bin/timeout --signal=TERM --kill-after=5s 90s python -I -S -B -m unittest discover -s benchmarks/paper/PAPER-paper-method-add-004/implementations/empirical-estimation -p 'test_producer.py' -v

  rep012-dependency-controls:
    needs: source-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.18'
      - name: Check exact public dependencies and protected-reference refusal
        shell: bash
        run: |
          set -euo pipefail
          ulimit -t 60
          /usr/bin/timeout --signal=TERM --kill-after=5s 90s python -I -S -B -m unittest discover -s tests/benchmarks -p 'test_rep012_dependency.py' -v
