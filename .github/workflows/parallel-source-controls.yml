name: Parallel construction source controls

on:
  pull_request:
    branches: [publish/neuroscience-200]
  push:
    branches: [publish/neuroscience-200]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parallel-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-preflight:
    uses: ./.github/workflows/source-maintenance-preflight.yml
  generated-controls:
    name: Generated controls (${{ matrix.group }})
    needs: source-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: stdlib-a
            python: '3.11.18'
          - group: stdlib-b
            python: '3.11.18'
          - group: numpy
            python: '3.11.18'
          - group: scientific
            python: '3.11.18'
          - group: torch-cpu
            python: '3.11.18'
          - group: legacy-pandas
            python: '3.9.25'
          - group: numpy226
            python: '3.11.18'
    env:
      PARALLEL_CONTROL_GROUP: ${{ matrix.group }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Authenticate launcher, controls, and manifest before execution
        shell: bash
        run: |
          python3 -I -S -B - <<'PY'
          import hashlib, os, stat
          pins = [
              {'path': 'scripts/maintenance/run_parallel_source_controls.py', 'bytes': 26530, 'sha256': '04b916987dfed1d003fb43f04e384576655dc1423d3c75f8f4ba29ff554bbcf2'},
              {'path': 'tests/maintenance/test_parallel_source_controls.py', 'bytes': 27731, 'sha256': '810d8a0f6dfa9063e39c5b6266c2307bea1b3ef61b9944ab6e9cda421b05cdd8'},
              {'path': 'benchmarks/integrity/parallel-source-controls.v1.json', 'bytes': 148508, 'sha256': '54a9a385a7c99252b51390b4da27f23420e963d17f66e0c61faf2cf11db177a7'},
          ]
          for pin in pins:
              path, size, digest = pin['path'], pin['bytes'], pin['sha256']
              with os.fdopen(os.open(path, os.O_RDONLY | os.O_NOFOLLOW), "rb") as stream:
                  before = os.fstat(stream.fileno())
                  assert stat.S_ISREG(before.st_mode) and before.st_nlink == 1 and before.st_size == size, path
                  raw = stream.read(size + 1)
                  after = os.fstat(stream.fileno())
                  assert (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns) == (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns), path
              assert len(raw) == size and hashlib.sha256(raw).hexdigest() == digest, path
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '${{ matrix.python }}'
          architecture: x64
      - name: Install exact generated-control dependencies
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          PARALLEL_LOCK="${RUNNER_TEMP}/parallel-lock-${PARALLEL_CONTROL_GROUP}.txt"
          case "$PARALLEL_CONTROL_GROUP" in
            stdlib-a|stdlib-b) ;;
            numpy)
              cat > "$PARALLEL_LOCK" <<'LOCK'
          numpy==2.4.6 --hash=sha256:89cd468399cfd2504718f0ba50e410dca55a170b61a02ad92bb18c8a65186e93
          LOCK
              ;;
            scientific)
              cat > "$PARALLEL_LOCK" <<'LOCK'
          h5py==3.16.0 --hash=sha256:fb1720028d99040792bb2fb31facb8da44a6f29df7697e0b84f0d79aff2e9bd3
          iniconfig==2.3.0 --hash=sha256:f631c04d2c48c52b84d0d0549c99ff3859c98df65b3101406327ecc7d53fbf12
          joblib==1.5.3 --hash=sha256:5fc3c5039fc5ca8c0276333a188bbd59d6b7ab37fe6632daa76bc7f9ec18e713
          narwhals==2.23.0 --hash=sha256:769e7b9ab102c93d8fa019f6b4cd1a657909b04a20bf6210e5a35aae06814ae9
          numpy==2.4.6 --hash=sha256:89cd468399cfd2504718f0ba50e410dca55a170b61a02ad92bb18c8a65186e93
          opt-einsum==3.4.0 --hash=sha256:69bb92469f86a1565195ece4ac0323943e83477171b91d24c35afe028a90d7cd
          packaging==26.3 --hash=sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c
          pluggy==1.6.0 --hash=sha256:e920276dd6813095e9377c0bc5566d94c932c33b27a3e3945d8389c374dd4746
          pygments==2.20.0 --hash=sha256:81a9e26dd42fd28a23a2d169d86d7ac03b46e2f8b59ed4698fb4785f946d0176
          pytest==9.1.1 --hash=sha256:37a86b45efb9a47a61a36449063e8e18d0cab3161329fc099eb21783169c4f0c
          scikit-learn==1.9.1 --hash=sha256:52a0703bbc07ad27f560fa63fa68e4c54dd735bfbbf65b4dd3c225dc7547b6df
          scipy==1.17.1 --hash=sha256:43af8d1f3bea642559019edfe64e9b11192a8978efbd1539d7bc2aaa23d92de4
          threadpoolctl==3.6.0 --hash=sha256:43a0b8fd5a2928500110039e43a5eed8480b918967083ea48dc3ab9f13c4a7fb
          tifffile==2024.8.30 --hash=sha256:8bc59a8f02a2665cd50a910ec64961c5373bee0b8850ec89d3b7b485bf7be7ad
          LOCK
              ;;
            torch-cpu)
              cat > "$PARALLEL_LOCK" <<'LOCK'
          filelock @ https://files.pythonhosted.org/packages/13/37/a065dc3bd6e49423a6532c642ca7378d3f467b1ef44c2800c937af7f9739/filelock-3.29.4-py3-none-any.whl --hash=sha256:dac1648087d5115554850d113e7dd8c83ab2d38e3435dde2d4f163847e57b767
          fsspec @ https://files.pythonhosted.org/packages/e5/22/4222d7ddf3da30f363edaa98e329c2bce6c65497c9cb2810931c8b2c0fbc/fsspec-2026.6.0-py3-none-any.whl --hash=sha256:02e0b71817df9b2169dc30a16832045764def1191b43dcff5bb85bdee212d2a1
          h5py==3.16.0 --hash=sha256:fb1720028d99040792bb2fb31facb8da44a6f29df7697e0b84f0d79aff2e9bd3
          jinja2 @ https://files.pythonhosted.org/packages/62/a1/3d680cbfd5f4b8f15abc1d571870c5fc3e594bb582bc3b64ea099db13e56/jinja2-3.1.6-py3-none-any.whl --hash=sha256:85ece4451f492d0c13c5dd7c13a64681a86afae63a5f347908daf103ce6d2f67
          joblib==1.5.3 --hash=sha256:5fc3c5039fc5ca8c0276333a188bbd59d6b7ab37fe6632daa76bc7f9ec18e713
          markupsafe @ https://files.pythonhosted.org/packages/30/ac/0273f6fcb5f42e314c6d8cd99effae6a5354604d461b8d392b5ec9530a54/markupsafe-3.0.3-cp311-cp311-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl --hash=sha256:0bf2a864d67e76e5c9a34dc26ec616a66b9888e25e7b9460e1c76d3293bd9dbf
          mpmath @ https://files.pythonhosted.org/packages/43/e3/7d92a15f894aa0c9c4b49b8ee9ac9850d6e63b03c9c32c0367a13ae62209/mpmath-1.3.0-py3-none-any.whl --hash=sha256:a0b2b9fe80bbcd81a6647ff13108738cfb482d481d826cc0e02f5b35e5c88d2c
          narwhals==2.23.0 --hash=sha256:769e7b9ab102c93d8fa019f6b4cd1a657909b04a20bf6210e5a35aae06814ae9
          networkx @ https://files.pythonhosted.org/packages/9e/c9/b2622292ea83fbb4ec318f5b9ab867d0a28ab43c5717bb85b0a5f6b3b0a4/networkx-3.6.1-py3-none-any.whl --hash=sha256:d47fbf302e7d9cbbb9e2555a0d267983d2aa476bac30e90dfbe5669bd57f3762
          numpy==2.4.6 --hash=sha256:89cd468399cfd2504718f0ba50e410dca55a170b61a02ad92bb18c8a65186e93
          scikit-learn==1.9.1 --hash=sha256:52a0703bbc07ad27f560fa63fa68e4c54dd735bfbbf65b4dd3c225dc7547b6df
          scipy==1.17.1 --hash=sha256:43af8d1f3bea642559019edfe64e9b11192a8978efbd1539d7bc2aaa23d92de4
          setuptools @ https://files.pythonhosted.org/packages/bb/26/7945080113158354380a12ce26873dd6c1ebd88d47f5bc24e2c5bb38c16a/setuptools-68.2.2-py3-none-any.whl --hash=sha256:b454a35605876da60632df1a60f736524eb73cc47bbc9f3f1ef1b644de74fd2a
          sympy @ https://files.pythonhosted.org/packages/a2/09/77d55d46fd61b4a135c444fc97158ef34a095e5681d0a6c10b75bf356191/sympy-1.14.0-py3-none-any.whl --hash=sha256:e091cc3e99d2141a0ba2847328f5479b05d94a6635cb96148ccb3f34671bd8f5
          threadpoolctl==3.6.0 --hash=sha256:43a0b8fd5a2928500110039e43a5eed8480b918967083ea48dc3ab9f13c4a7fb
          torch @ https://download-r2.pytorch.org/whl/cpu/torch-2.12.1%2Bcpu-cp311-cp311-manylinux_2_28_x86_64.whl --hash=sha256:04cd8b002c03dd6a246fbb4ae5abf1edd42adf0a9929ad82162c973e5737b5ac
          typing-extensions @ https://files.pythonhosted.org/packages/18/67/36e9267722cc04a6b9f15c7f3441c2363321a3ea07da7ae0c0707beb2a9c/typing_extensions-4.15.0-py3-none-any.whl --hash=sha256:f0fa19c6845758ab08074a0cfa8b7aecb71c999ca73d62883bc25cc018c4e548
          LOCK
              ;;
            legacy-pandas)
              cat > "$PARALLEL_LOCK" <<'LOCK'
          h5py==3.11.0 --hash=sha256:67462d0669f8f5459529de179f7771bd697389fcb3faab54d63bf788599a48ea
          numpy==1.26.3 --hash=sha256:b4d362e17bcb0011738c2d83e0a65ea8ce627057b2fdda37678f4374a382a137
          pandas==1.3.4 --hash=sha256:10e10a2527db79af6e830c3d5842a4d60383b162885270f8cffc15abca4ba4a9
          python-dateutil==2.9.0.post0 --hash=sha256:a8b2bc7bffae282281c8140a97d3aa9c14da0b136dfe83f850eea9a5f7470427
          pytz==2024.1 --hash=sha256:328171f4e3623139da4983451950b28e95ac706e13f3f2630a879749e7a8b319
          six==1.16.0 --hash=sha256:8abb2f1d86890a2dfb989f9a77cfcfd3e47c2a354b01111771326f8aa26e0254
          LOCK
              ;;
            numpy226)
              cat > "$PARALLEL_LOCK" <<'LOCK'
          numpy==2.2.6 --hash=sha256:ba10f8411898fc418a521833e014a77d3ca01c15b0c6cdcce6a0d2897e6dbbdf
          LOCK
              ;;
            *) exit 2 ;;
          esac
          if test -f "$PARALLEL_LOCK"; then
            timeout --signal=TERM --kill-after=5s 600s python -I -B -m pip install --isolated --no-cache-dir --only-binary=:all: --require-hashes -r "$PARALLEL_LOCK"
          fi
          python -VV
      - name: Verify launcher on the default and legacy interpreters
        if: matrix.group == 'stdlib-a' || matrix.group == 'legacy-pandas'
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 60s python -I -S -B tests/maintenance/test_parallel_source_controls.py
      - name: Acquire exact public source fixtures
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          timeout --signal=TERM --kill-after=5s 190s python -I -S -B scripts/maintenance/run_parallel_source_controls.py --manifest benchmarks/integrity/parallel-source-controls.v1.json --group "$PARALLEL_CONTROL_GROUP" --prepare-fixtures --fixtures "${RUNNER_TEMP}/parallel-fixtures-${PARALLEL_CONTROL_GROUP}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Run every required generated control with zero skips
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          timeout --signal=TERM --kill-after=5s 1200s python -I -B scripts/maintenance/run_parallel_source_controls.py --manifest benchmarks/integrity/parallel-source-controls.v1.json --group "$PARALLEL_CONTROL_GROUP" --fixtures "${RUNNER_TEMP}/parallel-fixtures-${PARALLEL_CONTROL_GROUP}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output "${RUNNER_TEMP}/parallel-source-${PARALLEL_CONTROL_GROUP}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Preserve generated-control results and acquisition accounting
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: parallel-source-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          path: |
            ${{ runner.temp }}/parallel-source-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}/
            ${{ runner.temp }}/parallel-fixtures-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}/acquisition-receipt.json
