          WHEELS = [{'name': 'jsonschema', 'version': '4.26.0', 'filename': 'jsonschema-4.26.0-py3-none-any.whl', 'url': 'https://files.pythonhosted.org/packages/69/90/f63fb5873511e014207a475e2bb4e8b2e570d655b00ac19a9a0ca0a385ee/jsonschema-4.26.0-py3-none-any.whl', 'bytes': 90630}, {'name': 'attrs', 'version': '25.4.0', 'filename': 'attrs-25.4.0-py3-none-any.whl', 'url': 'https://files.pythonhosted.org/packages/3a/2a/7cc015f5b9f5db42b7d48157e23356022889fc354a2813c15934b7cb5c0e/attrs-25.4.0-py3-none-any.whl', 'bytes': 67615}, {'name': 'jsonschema-specifications', 'version': '2025.9.1', 'filename': 'jsonschema_specifications-2025.9.1-py3-none-any.whl', 'url': 'https://files.pythonhosted.org/packages/41/45/1a4ed80516f02155c51f51e8cedb3c1902296743db0bbc66608a0db2814f/jsonschema_specifications-2025.9.1-py3-none-any.whl', 'bytes': 18437}, {'name': 'referencing', 'version': '0.37.0', 'filename': 'referencing-0.37.0-py3-none-any.whl', 'url': 'https://files.pythonhosted.org/packages/2c/58/ca301544e1fa93ed4f80d724bf5b194f6e4b945841c5bfd555878eea9fcb/referencing-0.37.0-py3-none-any.whl', 'bytes': 26766}, {'name': 'rpds-py', 'version': '0.30.0', 'filename': 'rpds_py-0.30.0-cp311-cp311-manylinux_2_17_x86_64.manylinux2014_x86_64.whl', 'url': 'https://files.pythonhosted.org/packages/f8/1e/372195d326549bb51f0ba0f2ecb9874579906b97e08880e7a65c3bef1a99/rpds_py-0.30.0-cp311-cp311-manylinux_2_17_x86_64.manylinux2014_x86_64.whl', 'bytes': 390828}, {'name': 'typing-extensions', 'version': '4.15.0', 'filename': 'typing_extensions-4.15.0-py3-none-any.whl', 'url': 'https://files.pythonhosted.org/packages/18/67/36e9267722cc04a6b9f15c7f3441c2363321a3ea07da7ae0c0707beb2a9c/typing_extensions-4.15.0-py3-none-any.whl', 'bytes': 44614}]
          EXPECTED_IDS = ['test_contract_validation.AdjudicationTransitionTests.test_existing_release_review_and_claim_requirements_remain', 'test_contract_validation.AdjudicationTransitionTests.test_ordinary_outcomes_keep_the_declared_stage_transitions', 'test_contract_validation.AdjudicationTransitionTests.test_terminal_outcomes_accept_both_calibrated_source_states', 'test_contract_validation.AdjudicationTransitionTests.test_terminal_outcomes_reject_wrong_stage_or_uncalibrated_state', 'test_contract_validation.AdjudicationTransitionTests.test_terminal_outcomes_require_the_matching_target_state', 'test_contract_validation.AdjudicationTransitionTests.test_worker_results_still_cannot_release_or_retire', 'test_contract_validation.EvidenceReferenceTests.test_optional_fields_and_extension_properties_remain_allowed', 'test_contract_validation.EvidenceReferenceTests.test_planned_and_missing_allow_empty_references', 'test_contract_validation.EvidenceReferenceTests.test_reference_array_remains_required_for_every_status', 'test_contract_validation.EvidenceReferenceTests.test_source_backed_statuses_accept_complete_references', 'test_contract_validation.EvidenceReferenceTests.test_source_backed_statuses_reject_empty_references', 'test_contract_validation.EvidenceReferenceTests.test_supplied_references_must_be_complete_and_well_formed']
          EXPECTED_COUNT = 12
          SCHEMA_PATH = 'src/neurobench/curation/contracts/curation-contracts-v1.schema.json'

          def need(ok, message):
              if not ok:
                  raise RuntimeError(message)

          def runtime():
              need(sys.platform == 'linux' and sys.implementation.name == 'cpython', 'Linux CPython required')
              need(sys.version_info[:3] == (3, 11, 18) and platform.machine() == 'x86_64', 'Unexpected interpreter/architecture')
              libc, version = platform.libc_ver()
              need(libc == 'glibc' and tuple(int(x) for x in version.split('.')[:2]) >= (2, 17), 'Unsupported libc')

          def canonical(name):
              return re.sub(r'[-_.]+', '-', name).lower()

          def beneath(path, root):
              return Path(path).resolve().is_relative_to(root)

          def acquire(stage):
              runtime()
              records = {}
              for line in REQUIREMENTS.splitlines():
                  match = re.fullmatch(r'([a-z0-9-]+)==([0-9.]+) --hash=sha256:([0-9a-f]{64})', line)
                  need(match is not None, 'Malformed frozen requirement')
                  name, version, digest = match.groups()
                  need(name not in records, 'Duplicate requirement')
                  records[name] = (version, digest)
              need(len(records) == len(WHEELS) == 6, 'Exactly six frozen wheels required')
              wheel_dir = stage / 'wheels'
              wheel_dir.mkdir(mode=0o700)
              total = 0
              for wheel in WHEELS:
                  name, filename = wheel['name'], wheel['filename']
                  need(Path(filename).name == filename and filename.endswith('.whl'), 'Invalid wheel filename')
                  need(records[name][0] == wheel['version'], 'Version mismatch')
                  url = wheel['url']
                  need(url.startswith('https://files.pythonhosted.org/packages/'), 'Unexpected wheel host')
                  request = urllib.request.Request(url, headers={'Accept-Encoding': 'identity'})
                  digest = hashlib.sha256()
                  written = 0
                  with urllib.request.urlopen(request, timeout=30) as response, (wheel_dir / filename).open('xb') as out:
                      need(response.status == 200 and response.geturl() == url, 'Unexpected download response')
                      length = response.headers.get('Content-Length')
                      need(length is None or int(length) == wheel['bytes'], 'Wheel length header mismatch')
                      while True:
                          block = response.read(min(65536, wheel['bytes'] + 1 - written))
                          if not block:
                              break
                          written += len(block)
                          need(written <= wheel['bytes'], 'Oversize wheel')
                          digest.update(block)
                          out.write(block)
                  need(written == wheel['bytes'] and digest.hexdigest() == records[name][1], 'Wheel size/hash mismatch')
                  total += written
              need(total == 638890 and total <= 16 * 1024 * 1024, 'Wheel closure exceeds selected extent')
              need({p.name for p in wheel_dir.iterdir()} == {r['filename'] for r in WHEELS}, 'Unexpected wheel member')
              (stage / 'requirements.txt').write_text(REQUIREMENTS, encoding='ascii')

          def environment(stage, repo):
              runtime()
              target = (stage / 'target').resolve()
              need(target.is_dir() and not target.is_relative_to(repo), 'Dependency target must be outside checkout')
              expected = {canonical(w['name']): w['version'] for w in WHEELS}
              observed = {}
              for dist in importlib.metadata.distributions(path=[str(target)]):
                  name = canonical(dist.metadata['Name'])
                  need(name not in observed and beneath(dist.locate_file(''), target), 'Duplicate/outside distribution')
                  need(dist.files is not None, 'Missing installed file record')
                  metadata_members = [member for member in dist.files if str(member).endswith('.dist-info/METADATA')]
                  need(len(metadata_members) == 1 and beneath(dist.locate_file(metadata_members[0]), target), 'Distribution metadata outside isolated target')
                  observed[name] = dist.version
              need(observed == expected, 'Installed closure differs from six frozen versions')
              sys.path.insert(0, str(target))
              for name in ['jsonschema', 'attrs', 'attr', 'jsonschema_specifications', 'referencing', 'rpds', 'typing_extensions']:
                  module = importlib.import_module(name)
                  need(module.__file__ is not None and beneath(module.__file__, target), 'Dependency module outside target')
                  need(module.__spec__.origin is not None and beneath(module.__spec__.origin, target), 'Dependency origin outside target')
                  for location in module.__spec__.submodule_search_locations or []:
                      need(beneath(location, target), 'Dependency package search outside target')
              import jsonschema
              validator = jsonschema.Draft202012Validator
              need(validator is jsonschema.validators.Draft202012Validator and validator.__module__ == 'jsonschema.validators', 'Actual Draft202012Validator required')
              need(beneath(jsonschema.validators.__file__, target), 'Validator implementation outside target')
              schema_id = 'https://json-schema.org/draft/2020-12/schema'
              need(validator.META_SCHEMA['$id'] == schema_id, 'Unexpected validator dialect')
              need(jsonschema.validators.validator_for({'$schema': schema_id}) is validator, 'Unexpected validator selection')
              validator.check_schema(json.loads((repo / SCHEMA_PATH).read_text(encoding='utf-8')))
              return validator

          def run_tests(stage, repo):
              validator = environment(stage, repo)
              loader = unittest.TestLoader()
              suite = loader.discover(str(repo / 'tests/curation'), pattern='test_*.py')
              need(not loader.errors, 'Curation discovery error')
              def flatten(item):
                  if isinstance(item, unittest.TestSuite):
                      for child in item:
                          yield from flatten(child)
                  else:
                      yield item
              ids = [case.id() for case in flatten(suite)]
              need(ids == EXPECTED_IDS and len(ids) == len(set(ids)) == EXPECTED_COUNT, 'Exact curation ID roster required')
              module = sys.modules['test_contract_validation']
              need(module.Draft202012Validator is validator, 'Curation tests must use actual selected validator')
              class Result(unittest.TextTestResult):
                  def __init__(self, *args, **kwargs):
                      super().__init__(*args, **kwargs)
                      self.started, self.stopped, self.succeeded = [], [], []
                  def startTest(self, case):
                      self.started.append(case.id())
                      super().startTest(case)
                  def stopTest(self, case):
                      self.stopped.append(case.id())
                      super().stopTest(case)
                  def addSuccess(self, case):
                      self.succeeded.append(case.id())
                      super().addSuccess(case)
              result = unittest.TextTestRunner(verbosity=2, resultclass=Result).run(suite)
              need(result.testsRun == EXPECTED_COUNT and result.started == result.stopped == result.succeeded == ids, 'Incomplete curation execution')
              need(result.wasSuccessful() and not any([result.failures, result.errors, result.skipped, result.expectedFailures, result.unexpectedSuccesses]), 'Curation outcomes must be all successful with zero skips')
              print(json.dumps({'expected_ids': ids, 'tests_run': result.testsRun, 'failures': 0, 'errors': 0, 'skips': 0, 'expected_failures': 0, 'unexpected_successes': 0}, sort_keys=True))

          if __name__ == '__main__':
              mode, stage_arg, repo_arg = sys.argv[1:]
              stage, repo = Path(stage_arg).resolve(), Path(repo_arg).resolve()
              need(stage.is_dir() and repo.is_dir() and not stage.is_relative_to(repo), 'Private stage must be outside checkout')
              if mode == 'acquire':
                  acquire(stage)
              elif mode == 'test':
                  run_tests(stage, repo)
              elif mode == 'validate':
                  environment(stage, repo)
                  entry = repo / 'scripts/validate_curation.py'
                  sys.argv = [str(entry)]
                  runpy.run_path(str(entry), run_name='__main__')
              else:
                  raise RuntimeError('Unknown curation mode')
          PY_CURATION
          timeout --signal=TERM --kill-after=5s 90s python -I -S -B "$CURATION_STAGE/check.py" acquire "$CURATION_STAGE" "$GITHUB_WORKSPACE"
          timeout --signal=TERM --kill-after=5s 90s python -I -B -m pip install --isolated --disable-pip-version-check --no-input --no-index --no-deps --only-binary=:all: --require-hashes --no-cache-dir --no-compile --find-links "$CURATION_STAGE/wheels" --target "$CURATION_STAGE/target" -r "$CURATION_STAGE/requirements.txt"
          timeout --signal=TERM --kill-after=5s 60s python -I -S -B "$CURATION_STAGE/check.py" test "$CURATION_STAGE" "$GITHUB_WORKSPACE"
          timeout --signal=TERM --kill-after=5s 60s python -I -S -B "$CURATION_STAGE/check.py" validate "$CURATION_STAGE" "$GITHUB_WORKSPACE"
      - name: Preserve generated-control results and acquisition accounting
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: parallel-source-${{ matrix.group }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          path: |
            ${{ runner.temp }}/parallel-source-${{ matrix.group }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}/
            ${{ runner.temp }}/parallel-fixtures-${{ matrix.group }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}/acquisition-receipt.json
            ${{ runner.temp }}/language-serialization-${{ github.run_id }}-${{ github.run_attempt }}/RESULT.json
            ${{ runner.temp }}/language-serialization-${{ github.run_id }}-${{ github.run_attempt }}/TEST_LOG.txt
