              with os.fdopen(os.open(path, os.O_RDONLY | os.O_NOFOLLOW), 'rb') as stream:
                  before = os.fstat(stream.fileno())
                  assert stat.S_ISREG(before.st_mode) and before.st_nlink == 1 and before.st_size == pin['bytes'], str(path)
                  raw = stream.read(pin['bytes'] + 1)
                  after = os.fstat(stream.fileno())
              fields = ('st_dev', 'st_ino', 'st_mode', 'st_nlink', 'st_size', 'st_mtime_ns', 'st_ctime_ns')
              assert all(getattr(before, key) == getattr(after, key) for key in fields), str(path)
              assert len(raw) == pin['bytes'] and hashlib.sha256(raw).hexdigest() == pin['sha256'], str(path)
              return raw
          
          pin = {'path': 'benchmarks/neural/NEURAL-063/implementations/versioned-range-v1/RUNTIME_SOURCES.json', 'bytes': 1055, 'sha256': 'a5368f17a7c1e663ace2256ffea9cf7138fa8fe863d512b29a38c23e40e516db'}
          spec = json.loads(checked(Path(pin['path']), pin))
          assert spec['versions'] == {'aiohttp': '3.14.3', 'fsspec': '2026.6.0', 'h5py': '3.16.0'}
          assert len(spec['files']) == 6
          for name, expected in spec['files'].items():
              distribution = importlib.metadata.distribution(name.split('/', 1)[0])
              assert distribution.version == spec['versions'][name.split('/', 1)[0]]
              checked(distribution.locate_file(name), expected)
          print(json.dumps({'checked_n063_library_sources': 6, 'source_bytes': sum(row['bytes'] for row in spec['files'].values()), 'scientific_qualification': False}))
          PY
