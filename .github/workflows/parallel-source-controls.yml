name: Parallel construction source controls

on:
  pull_request:
    branches: [publish/neuroscience-200]
  push:
    branches: [publish/neuroscience-200]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parallel-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-preflight:
    uses: ./.github/workflows/source-maintenance-preflight.yml
  generated-controls:
    name: Generated controls (${{ matrix.group }}, shard ${{ matrix.shard }}/${{ matrix.shards }})
    needs: source-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: stdlib-a
            python: '3.11.18'
            shard: 0
            shards: 2
          - group: stdlib-a
            python: '3.11.18'
            shard: 1
            shards: 2
          - group: stdlib-b
            python: '3.11.18'
            shard: 0
            shards: 2
          - group: stdlib-b
            python: '3.11.18'
            shard: 1
            shards: 2
          - group: numpy
            python: '3.11.18'
            shard: 0
            shards: 4
          - group: numpy
            python: '3.11.18'
            shard: 1
            shards: 4
          - group: numpy
            python: '3.11.18'
            shard: 2
            shards: 4
          - group: numpy
            python: '3.11.18'
            shard: 3
            shards: 4
          - group: scientific
            python: '3.11.18'
            shard: 0
            shards: 1
          - group: torch-cpu
            python: '3.11.18'
            shard: 0
            shards: 1
          - group: legacy-pandas
            python: '3.9.25'
            shard: 0
            shards: 1
          - group: numpy226
            python: '3.11.18'
            shard: 0
            shards: 1
          - group: meg-reference
            python: '3.11.18'
            shard: 0
            shards: 1
          - group: marble-native
            python: '3.11.18'
            shard: 0
            shards: 1
          - group: neural063-range
            python: '3.11.18'
            shard: 0
            shards: 1
          - group: language-rootfs
            python: '3.11.6'
            shard: 0
            shards: 1
          - group: jaxley-input-cpu
            python: '3.11.18'
            shard: 0
            shards: 1
          - group: erp-core-builder
            python: '3.11.6'
            shard: 0
            shards: 1
          - group: smc-restricted-valid
            python: '3.11.6'
            shard: 0
            shards: 1
          - group: smc-gain-calibration
            python: '3.11.6'
            shard: 0
            shards: 1
    env:
      PARALLEL_CONTROL_GROUP: ${{ matrix.group }}
      PARALLEL_CONTROL_SHARD: ${{ matrix.shard }}
      PARALLEL_CONTROL_SHARDS: ${{ matrix.shards }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Authenticate launcher, controls, and manifest before execution
        shell: bash
        run: |
          python3 -I -S -B - <<'PY'
          import hashlib, os, stat
          pins = [{'path': 'scripts/maintenance/run_parallel_source_controls.py', 'bytes': 29993, 'sha256': 'c60f2db58bfd156a9a83c72eb35a8959d67763af70932f833ef98a2083b38e36'}, {'path': 'tests/maintenance/test_parallel_source_controls.py', 'bytes': 51098, 'sha256': '073f920a233d8853ceb1e2143c63a2a07692bae242937a1eafa743fbd8ce3141'}, {'path': 'benchmarks/integrity/parallel-source-controls.v1.json', 'bytes': 639901, 'sha256': 'b804fc90a7dc1000a385af744ef880dcfb03548620abdb8369124d75c426e53c'}]
          for pin in pins:
              path, size, digest = pin['path'], pin['bytes'], pin['sha256']
              with os.fdopen(os.open(path, os.O_RDONLY | os.O_NOFOLLOW), "rb") as stream:
                  before = os.fstat(stream.fileno())
                  assert stat.S_ISREG(before.st_mode) and before.st_nlink == 1 and before.st_size == size, path
                  raw = stream.read(size + 1)
                  after = os.fstat(stream.fileno())
                  assert (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns) == (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns), path
              assert len(raw) == size and hashlib.sha256(raw).hexdigest() == digest, path
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '${{ matrix.python }}'
          architecture: x64
      - name: Install exact generated-control dependencies
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          PARALLEL_LOCK="${RUNNER_TEMP}/parallel-lock-${PARALLEL_CONTROL_GROUP}.txt"
          case "$PARALLEL_CONTROL_GROUP" in
            stdlib-a|stdlib-b|language-rootfs) ;;
            numpy)
