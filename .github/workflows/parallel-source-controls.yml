name: Parallel construction source controls

on:
  pull_request:
    branches: [publish/neuroscience-200]
  push:
    branches: [publish/neuroscience-200]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parallel-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-preflight:
    uses: ./.github/workflows/source-maintenance-preflight.yml
  generated-controls:
    name: Generated controls (${{ matrix.group }})
    needs: source-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: stdlib-a
            python: '3.11.18'
          - group: stdlib-b
            python: '3.11.18'
          - group: numpy
            python: '3.11.18'
          - group: scientific
            python: '3.11.18'
          - group: torch-cpu
            python: '3.11.18'
          - group: legacy-pandas
            python: '3.9.25'
          - group: numpy226
            python: '3.11.18'
          - group: meg-reference
            python: '3.11.18'
          - group: marble-native
            python: '3.11.18'
          - group: neural063-range
            python: '3.11.18'
          - group: language-rootfs
            python: '3.11.6'
          - group: jaxley-input-cpu
            python: '3.11.18'
          - group: erp-core-builder
            python: '3.11.6'
          - group: smc-restricted-valid
            python: '3.11.6'
          - group: smc-gain-calibration
            python: '3.11.6'
    env:
      PARALLEL_CONTROL_GROUP: ${{ matrix.group }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Authenticate launcher, controls, and manifest before execution
        shell: bash
        run: |
          python3 -I -S -B - <<'PY'
          import hashlib, os, stat
          pins = [
              {'path': 'scripts/maintenance/run_parallel_source_controls.py', 'bytes': 27324, 'sha256': 'be8cd8c31fe82a671e899cf020861e89464d9bbc00f833c88df27e61679553e3'},
              {'path': 'tests/maintenance/test_parallel_source_controls.py', 'bytes': 35609, 'sha256': 'd1fc0abb98e02a8d9afb1f49d01f418f2922369a575a40fa531def0f569e178a'},
              {'path': 'benchmarks/integrity/parallel-source-controls.v1.json', 'bytes': 596024, 'sha256': '018a3dbd62c6c6fb5b4e1f33acfe28a5fc1c59da9a63977ab68d0e9ded8e2024'},
          ]
          for pin in pins:
              path, size, digest = pin['path'], pin['bytes'], pin['sha256']
              with os.fdopen(os.open(path, os.O_RDONLY | os.O_NOFOLLOW), "rb") as stream:
                  before = os.fstat(stream.fileno())
                  assert stat.S_ISREG(before.st_mode) and before.st_nlink == 1 and before.st_size == size, path
                  raw = stream.read(size + 1)
                  after = os.fstat(stream.fileno())
                  assert (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns) == (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns), path
              assert len(raw) == size and hashlib.sha256(raw).hexdigest() == digest, path
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '${{ matrix.python }}'
          architecture: x64
      - name: Install exact generated-control dependencies
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          PARALLEL_LOCK="${RUNNER_TEMP}/parallel-lock-${PARALLEL_CONTROL_GROUP}.txt"
          case "$PARALLEL_CONTROL_GROUP" in
            stdlib-a|stdlib-b|language-rootfs) ;;
            numpy)
              cat > "$PARALLEL_LOCK" <<'LOCK'
          numpy==2.4.6 --hash=sha256:89cd468399cfd2504718f0ba50e410dca55a170b61a02ad92bb18c8a65186e93
          LOCK
