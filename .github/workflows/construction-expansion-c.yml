          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import stat

          root = Path('.').absolute()
          rows = [
              {
                  "path": "benchmarks/paper/PAPER-paper-signal-add-012/docs/initial-evaluator-v1.md",
                  "bytes": 10933,
                  "sha256": "4c3bd0e55c922abdd1f9b4a1c43426a7dc57dc3ce4e3fbddacea24bda178e45b"
              },
              {
                  "path": "benchmarks/paper/PAPER-paper-signal-add-012/implementations/initial-evaluator-v1/LICENSE",
                  "bytes": 35149,
                  "sha256": "3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986"
              },
              {
                  "path": "benchmarks/paper/PAPER-paper-signal-add-012/implementations/initial-evaluator-v1/README.md",
                  "bytes": 1494,
                  "sha256": "253b9b7f6b2f6ba64bb2078d5bff0e926e6f606bc4677cb4b77f993cb25c9cad"
              },
              {
                  "path": "benchmarks/paper/PAPER-paper-signal-add-012/implementations/initial-evaluator-v1/evaluator.py",
                  "bytes": 15429,
                  "sha256": "c423cd3eae8501fc4484965ce232a0b422e45da251a2b267d3532faf5319e56d"
              },
              {
                  "path": "benchmarks/paper/PAPER-paper-signal-add-012/implementations/initial-evaluator-v1/provenance.json",
                  "bytes": 2690,
                  "sha256": "e5d61ff8e004cc7b3fd4969e6f5599ee279e96a62fe95c6ec7716c3d1dfd33b7"
              },
              {
                  "path": "benchmarks/paper/PAPER-paper-signal-add-012/implementations/initial-evaluator-v1/tests/test_evaluator.py",
                  "bytes": 8981,
                  "sha256": "32067ef8b92bc29bc73d02f50ec423c8e73af3b2f31b6c5750957320c9eccf6b"
              },
              {
                  "path": "benchmarks/paper/PAPER-paper-signal-add-012/historical/task.pre-improvement.v1.json",
                  "bytes": 20725,
                  "sha256": "66d8975ed4f868e9289d6824b0152105a6f8deaeca9d2efd97b2a8cbb4474aae"
              }
          ]
          packages = [
              "benchmarks/paper/PAPER-paper-signal-add-012/implementations/initial-evaluator-v1"
          ]
          assert len(rows) == 7 > 0
          assert sum(row['bytes'] for row in rows) == 95401 <= 33554432
          expected = {}
          def path_for(relative, *, directory=False):
              p = PurePosixPath(relative)
              assert str(p) == relative and not p.is_absolute()
              assert '\\' not in relative and all(x not in ('', '.', '..') for x in relative.split('/'))
              current = root
              for part in p.parts:
                  current = current / part
                  assert not current.is_symlink(), relative
              info = current.lstat()
              assert stat.S_ISDIR(info.st_mode) if directory else stat.S_ISREG(info.st_mode), relative
              return current
          def stamp(info):
              return info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns, info.st_ctime_ns
          for row in rows:
              assert set(row) == {'path', 'bytes', 'sha256'}
              assert row['path'] not in expected
              assert type(row['bytes']) is int and 0 <= row['bytes'] <= 8388608
              assert len(row['sha256']) == 64 and set(row['sha256']) <= set('0123456789abcdef')
              path = path_for(row['path'])
              before = path.lstat()
              assert before.st_nlink == 1 and before.st_size == row['bytes'], row['path']
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              with os.fdopen(fd, 'rb') as stream:
                  opened = os.fstat(stream.fileno())
                  assert stamp(opened) == stamp(before)
                  body = stream.read(row['bytes'] + 1)
                  assert stamp(os.fstat(stream.fileno())) == stamp(opened)
              assert stamp(path_for(row['path']).lstat()) == stamp(before)
              assert len(body) == row['bytes'] and hashlib.sha256(body).hexdigest() == row['sha256'], row['path']
              expected[row['path']] = row
          for package in packages:
              path_for(package, directory=True)
              observed = set()
              for directory, directories, files in os.walk(root / package, followlinks=False):
                  for name in directories:
                      path_for((Path(directory) / name).relative_to(root).as_posix(), directory=True)
                  for name in files:
                      relative = (Path(directory) / name).relative_to(root).as_posix()
                      path_for(relative)
                      observed.add(relative)
              assert observed == {p for p in expected if p.startswith(package + '/')}, package
          print(json.dumps({'verified_source_files': len(expected), 'verified_bytes': 95401,
                            'complete_new_packages': len(packages), 'generated_controls_only': True,
                            'authentic_data_read': False, 'scientific_qualification': False}))
          PY
