          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.18'
      - name: Check pfc-science2-package scientific source
        shell: bash
        working-directory: components/pfc-science2-package
        run: |
          set -euo pipefail
          umask 077
          NEURAL_SOURCE_LOGS="${RUNNER_TEMP}/pfc-science2-package-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$NEURAL_SOURCE_LOGS"
          export PFC_FIXTURE_ROOT="${RUNNER_TEMP}/pfc-fixtures-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$PFC_FIXTURE_ROOT"
          export PFC_LOCAL_FIXTURE_ROOT="${RUNNER_TEMP}/pfc-local-fixtures-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$PFC_LOCAL_FIXTURE_ROOT"
          set +e
          /usr/bin/timeout --signal=TERM --kill-after=5s 60s python -I -S -B -m unittest discover -s . -p 'test_*.py' -v >"$NEURAL_SOURCE_LOGS/tests.stdout" 2>"$NEURAL_SOURCE_LOGS/tests.stderr"
          NEURAL_SOURCE_STATUS=$?
          printf '%s\n' "$NEURAL_SOURCE_STATUS" >"$NEURAL_SOURCE_LOGS/tests.status"
          cat "$NEURAL_SOURCE_LOGS/tests.stdout"
          cat "$NEURAL_SOURCE_LOGS/tests.stderr"
          exit "$NEURAL_SOURCE_STATUS"
      - name: Preserve pfc-science2-package source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pfc-science2-package-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
