          import hashlib
          import json
          import os
          from pathlib import Path
          import stat
          import sys
          import types
          import unittest


          def require(value, message):
              if not value:
                  raise ValueError(message)


          def signature(s):
              return (s.st_dev, s.st_ino, s.st_mode, s.st_nlink, s.st_size,
                      s.st_mtime_ns, s.st_ctime_ns)


          def read_exact(path, extent, expected):
              require(type(extent) is int and 0 < extent <= 262144, 'bounded source extent')
              require(not any(p.is_symlink() for p in (path, *path.parents)), 'no source aliases')
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  before = os.fstat(fd)
                  require(stat.S_ISREG(before.st_mode) and before.st_nlink == 1 and
                          before.st_size == extent, 'ordinary exact source member')
                  blocks = []
                  remaining = extent
                  while remaining:
                      block = os.read(fd, min(65536, remaining))
                      require(bool(block), 'complete source read')
                      blocks.append(block)
                      remaining -= len(block)
                  require(not os.read(fd, 1), 'source EOF')
                  require(signature(before) == signature(os.fstat(fd)) == signature(path.lstat()),
                          'stable source member')
                  body = b''.join(blocks)
                  require(hashlib.sha256(body).hexdigest() == expected, 'source hash')
                  return body
              finally:
                  os.close(fd)


          root = Path.cwd()
          manifest = read_exact(root / 'SOURCE.json', 2179,
