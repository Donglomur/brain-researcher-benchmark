          import hashlib, json, stat, sys
          from pathlib import Path
          spec_path, out = map(Path, sys.argv[1:])
          spec_raw = spec_path.read_bytes()
          assert len(spec_raw) == 13797 and hashlib.sha256(spec_raw).hexdigest() == 'cb7ff9b608fd80f3fee90a228b9e475e62f6b391a553f2b9b4f6be2fd0414c5c'
          spec = json.loads(spec_raw)
          expected = set(spec['expected_success_output']['files'])
          assert len(expected) == 32
          rows, total = [], 0
          for path in sorted(out.rglob('*')):
              assert not path.is_symlink()
              if path.is_dir():
                  continue
              before = path.lstat()
              assert stat.S_ISREG(before.st_mode) and before.st_nlink == 1 and 0 < before.st_size <= 262144
              body = path.read_bytes()
              after = path.lstat()
              assert len(body) == before.st_size
              assert all(getattr(before, k) == getattr(after, k) for k in ('st_dev', 'st_ino', 'st_mode', 'st_nlink', 'st_size', 'st_mtime_ns', 'st_ctime_ns'))
              total += len(body)
              assert total <= 8388608
              rows.append({'relative_path': str(path.relative_to(out)), 'bytes': len(body), 'sha256': hashlib.sha256(body).hexdigest()})
          assert {row['relative_path'] for row in rows} == expected
          empty = out / spec['expected_success_output']['extra_empty_directory']
          assert empty.is_dir() and not any(empty.iterdir())
          result = json.loads((out / 'RESULTS.json').read_bytes())
          assert result['status'] == 'PASS' and result['declared_controls'] == result['observed_controls'] == 51
          assert [row['id'] for row in result['controls']] == spec['ordered_control_ids']
          assert all(row['status'] == 'PASS' for row in result['controls'])
          assert result['new_benchmarks'] == 0 and result['submission_ready_established'] is False
          print(json.dumps({'fixture_files': rows, 'fixture_bytes': total, 'controls': 51, 'invented_only': True, 'scientific_run': False}))
          NIDER_OUTPUT_CLOSURE
          NIDER_CLOSURE_STATUS=$?
          set -e
          printf '%s\n' "$NIDER_CLOSURE_STATUS" >"$NIDER_PUBLIC_ROOT/output-closure.status"
          exit "$NIDER_CLOSURE_STATUS"
