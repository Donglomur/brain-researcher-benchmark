          import hashlib, json, stat, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          assert sys.version_info[:3] == (3, 11, 18)
          def read_exact(path, size, digest):
              assert path.is_absolute() and not any(p.is_symlink() for p in (path, *path.parents))
              before = path.lstat()
              assert stat.S_ISREG(before.st_mode) and before.st_nlink == 1 and before.st_size == size and 0 < size <= 1048576
              with path.open('rb') as stream:
                  body = stream.read(size + 1)
              after = path.lstat()
              assert len(body) == size and hashlib.sha256(body).hexdigest() == digest
              assert all(getattr(before, k) == getattr(after, k) for k in ('st_dev', 'st_ino', 'st_mode', 'st_nlink', 'st_size', 'st_mtime_ns', 'st_ctime_ns'))
              return body
          manifest = json.loads(read_exact(root / 'SOURCE_MANIFEST.json', 4437, 'b60197b3a3a140400cc23ddfdc94b629e9444cac0c7c699f960496060d328ed4'))
          assert set(manifest) == {'schema', 'files'} and manifest['schema'] == 'nider_public_source_manifest_v1'
          assert type(manifest['files']) is list and len(manifest['files']) == 26
          seen = set()
          total = 0
          for row in manifest['files']:
              assert set(row) == {'relative_path', 'bytes', 'sha256'}
              relative = Path(row['relative_path'])
              assert not relative.is_absolute() and '..' not in relative.parts and str(relative) == row['relative_path']
              assert str(relative) not in seen
              seen.add(str(relative))
              total += row['bytes']
              assert total <= 2097152
              read_exact(root / relative, row['bytes'], row['sha256'])
          assert total == 227404
          actual = {str(path.relative_to(root)) for path in root.rglob('*') if path.is_file() or path.is_symlink()}
          assert actual == seen | {'SOURCE_MANIFEST.json'}
          print(json.dumps({'source_files': len(seen), 'source_bytes': total, 'authentic_assets_read': False, 'python_version': sys.version}))
          NIDER_SOURCE_AUTH
          NIDER_SOURCE_STATUS=$?
          printf '%s\n' "$NIDER_SOURCE_STATUS" >"$NIDER_PUBLIC_ROOT/source-auth.status"
          if [ "$NIDER_SOURCE_STATUS" -ne 0 ]; then exit "$NIDER_SOURCE_STATUS"; fi
          /usr/bin/timeout --signal=TERM --kill-after=5s 60s python -I -S -B "$NIDER_PUBLIC_SOURCE/tests/public_source_controls.py" --output "$NIDER_PUBLIC_ROOT/controls" >"$NIDER_PUBLIC_ROOT/controls.stdout" 2>"$NIDER_PUBLIC_ROOT/controls.stderr"
          NIDER_CONTROL_STATUS=$?
