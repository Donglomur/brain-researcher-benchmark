              require(stat.S_ISREG(s.st_mode) and s.st_nlink == 1, 'no unlisted directories/aliases')
          require(sum(r['bytes'] for r in rows) == 125692, 'complete source extent')
          bodies = {r['path']: read_exact(root / r['path'], r['bytes'], r['sha256']) for r in rows}
          # No package code executes before every member is authenticated. Select only
          # this exact captured test module; do not discover unlisted Python files.
          name = 'helsinki_zero_case_generated_tests'
          require(name not in sys.modules, 'fresh test module')
