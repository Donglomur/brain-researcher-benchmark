              rows = manifest['files']
              if type(rows) is not list or len(rows) != len(NAMES):
                  raise ValueError('complete public member roster required')
              names = set()
              for row in rows:
                  if type(row) is not dict or set(row) != {'path', 'bytes', 'sha256'}:
                      raise ValueError('public manifest member shape differs')
                  if type(row['path']) is not str or row['path'] not in NAMES or row['path'] in names:
                      raise ValueError('public manifest member name differs')
                  if type(row['bytes']) is not int or not 0 < row['bytes'] <= 262144:
                      raise ValueError('public member extent differs')
                  if type(row['sha256']) is not str or not re.fullmatch('[0-9a-f]{64}', row['sha256']):
                      raise ValueError('public member digest shape differs')
                  names.add(row['path'])
              if names != NAMES or {p.name for p in root.iterdir()} != NAMES | {'COMPONENT_SOURCE.json'}:
                  raise ValueError('complete public directory roster differs')
              bodies = {row['path']: read_exact(root / row['path'], row['bytes'], row['sha256']) for row in rows}
              return bodies, manifest_body


