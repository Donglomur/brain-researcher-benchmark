          """CI-only bootstrap: authenticate all public members before package execution."""
          import hashlib
          import json
          import os
          from pathlib import Path
          import runpy
          import stat

          MANIFEST_BYTES = 1124
          MANIFEST_SHA256 = 'c4a03e130d0a645e71115303fb3aedac60708d932648ea20a507fa6c73998e57'

          def identity(value):
              return (value.st_dev, value.st_ino, value.st_mode, value.st_nlink,
                      value.st_size, value.st_mtime_ns, value.st_ctime_ns)

          def read_exact(path, size, digest):
              before = path.lstat()
              if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or before.st_size != size:
                  raise ValueError('public member type or extent differs: ' + path.name)
              with os.fdopen(os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK), 'rb') as stream:
                  if identity(os.fstat(stream.fileno())) != identity(before):
                      raise ValueError('public member changed before read')
                  body = stream.read(size + 1)
                  after = os.fstat(stream.fileno())
              if identity(before) != identity(after) or identity(after) != identity(path.lstat()):
                  raise ValueError('public member changed during read')
              if len(body) != size or hashlib.sha256(body).hexdigest() != digest:
                  raise ValueError('public member digest differs: ' + path.name)
              return body

          def verify(root):
              if root.is_symlink() or not root.is_dir():
                  raise ValueError('public component root must be an ordinary directory')
              manifest = json.loads(read_exact(root / 'SOURCE_MANIFEST.json', MANIFEST_BYTES, MANIFEST_SHA256))
              if set(manifest) != {'schema', 'members'} or manifest['schema'] != 'fly-pid-public-source-manifest-v1':
                  raise ValueError('public manifest schema differs')
              rows = manifest['members']
              if not isinstance(rows, list) or len(rows) != 7:
                  raise ValueError('complete seven public source members required')
              names = set()
              for row in rows:
                  if set(row) != {'path', 'bytes', 'sha256'} or not isinstance(row['path'], str):
                      raise ValueError('public manifest member shape differs')
                  name = row['path']
                  if name in names or name in ('.', '..', 'SOURCE_MANIFEST.json') or '/' in name or '\\' in name:
                      raise ValueError('public manifest member path differs')
                  if type(row['bytes']) is not int or not 0 < row['bytes'] <= 262144:
                      raise ValueError('public manifest byte ceiling differs')
                  names.add(name)
              if {path.name for path in root.iterdir()} != names | {'SOURCE_MANIFEST.json'}:
                  raise ValueError('complete public component inventory differs')
              for row in rows:
                  read_exact(root / row['path'], row['bytes'], row['sha256'])
              return True

          if __name__ == '__main__':
              root = Path('benchmarks/neural/NEURAL-SCOPE-20261114-FLY-ODOR-MEMORY/implementations/pid-preparation')
              verify(root)
              runpy.run_path(str(root / 'run_public_checks.py'), run_name='__main__')
