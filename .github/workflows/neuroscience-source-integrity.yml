        shell: bash
        run: |
          set -euo pipefail
          ulimit -t 60
          ulimit -v 131072
          /usr/bin/timeout --signal=TERM --kill-after=5s 90s python -I -S -B - <<'N090_NUMERICAL'
          import hashlib, importlib.util, pathlib, sys, unittest
          if sys.flags.optimize:
              raise RuntimeError("source controls require assertions enabled")
          root = pathlib.Path("benchmarks/neural/NEURAL-090/implementations/neural-090/investigation-claims-v1")
          for name, size, digest in [
              ("claims.py", 15025, "3902466dee7b45003c76e5a2821982da53f5d2c27e7ee0532fd60e6b95ded48d"),
              ("test_claims.py", 11657, "cc0aee6572f2dab780683ac5183f5e451cda61643d9d1e79a37284b1b54278bb"),
          ]:
              data = (root / name).read_bytes()
              if len(data) != size or hashlib.sha256(data).hexdigest() != digest:
                  raise RuntimeError("selected numerical consumer/test source changed")
          spec = importlib.util.spec_from_file_location("n090_claim_controls", root / "test_claims.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromModule(module)
          if suite.countTestCases() != 12:
              raise RuntimeError("all twelve declared source controls required")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not (result.testsRun == 12 and result.wasSuccessful() and not result.skipped and not result.expectedFailures and not result.unexpectedSuccesses):
              raise SystemExit(1)
          N090_NUMERICAL

  reward-complete-programme-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.18'
      - name: Validate relocated complete reward source and generated execution
        shell: bash
        run: |
          set -euo pipefail
          ulimit -t 60
          ulimit -v 131072
          /usr/bin/timeout --signal=TERM --kill-after=5s 90s python -I -S -B - <<'REWARD_SOURCE'
          import hashlib, importlib.util, json, pathlib, stat, sys, unittest

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def safe_path(value):
              require(isinstance(value, str) and value, "nonempty source path required")
              path = pathlib.PurePosixPath(value)
              require(not path.is_absolute() and path.as_posix() == value
                      and ".." not in path.parts and "\\" not in value,
                      "ordinary relative source path required: " + value)
              return pathlib.Path(value)

          def read_pin(row):
              path = safe_path(row["path"])
              require(type(row["bytes"]) is int and row["bytes"] >= 0,
                      "nonnegative source length required")
              for part in (path, *path.parents):
                  require(not part.is_symlink(), "source symlink refused: " + str(part))
              info = path.lstat()
              require(stat.S_ISREG(info.st_mode) and info.st_nlink == 1
                      and info.st_size == row["bytes"], "ordinary source size changed: " + str(path))
              body = path.read_bytes()
              require(len(body) == row["bytes"] and hashlib.sha256(body).hexdigest() == row["sha256"],
                      "source bytes changed: " + str(path))
              return body

          def index_rows(rows, prefix=""):
              result = {}
              for row in rows:
                  require(set(row) == {"path", "bytes", "sha256"}, "exact source pin fields required")
                  safe_path(row["path"])
                  path = prefix + row["path"]
                  require(path not in result, "duplicate source member: " + path)
                  result[path] = {**row, "path": path}
              return result

          require(not sys.flags.optimize, "source controls require assertions enabled")
          root = pathlib.Path("benchmarks/shared/reward-spacing/programme")
          prefix = root.as_posix() + "/"
          distribution_pin = {"path": prefix + "SOURCE.json", "bytes": 12836,
                              "sha256": "2dca8ebda561d2cd0f6aa24d50d062026eb2a27a531fa01cd3a7830295e2f1f6"}
          historical_lock_pin = {"path": prefix + "SOURCE_LOCK.json", "bytes": 10437,
                                 "sha256": "fd0c305c66052a38ef76a42f874b9d798703753b3c12b85db861152c225907e9"}
          descriptor_pin = {"path": "benchmarks/integrity/current-closures/numeric-reward/SOURCE_BINDINGS.json",
                            "bytes": 21467, "sha256": "8bbe57470737f099e40799b08c288f8efc5f9cf9bef13f12cf5a031120d80584"}
          distribution = json.loads(read_pin(distribution_pin))
          historical_lock = json.loads(read_pin(historical_lock_pin))
          descriptor = json.loads(read_pin(descriptor_pin))
          require(distribution["schema"] == "reward_complete_public_source_v1"
                  and distribution["file_count"] == 71 and distribution["total_bytes"] == 991897,
                  "historical reward distribution identity changed")
          require(descriptor["schema"] == "reward_numeric_current_source_bindings_v1"
                  and descriptor["package_root"] == root.as_posix()
                  and descriptor["comparison_commit"] == "68a9ae5c9bd927949fee99b1add5793f7e7d88b0",
                  "current reward descriptor identity changed")
          require(descriptor["historical_manifests"] == [distribution_pin, historical_lock_pin],
                  "reward predecessor manifest identity changed")
          for value in (distribution, descriptor):
              require(value["scientific_qualification"] is False
                      and value["authentic_execution_available"] is False,
                      "generated controls do not grant scientific qualification")
          require(descriptor["execution_authority"] is False and descriptor["new_benchmark_ids"] == 0,
                  "current source repair grants no execution authority or new benchmark IDs")
          historical = index_rows(distribution["files"], prefix)
          require(len(historical) == 71 and sum(row["bytes"] for row in historical.values()) == 991897,
                  "historical distribution membership changed")
          require(historical_lock_pin == historical[prefix + "SOURCE_LOCK.json"]
                  and {**distribution["source_lock"], "path": prefix + distribution["source_lock"]["path"]}
                  == historical_lock_pin, "historical lock binding changed")
          historical_locked = index_rows(historical_lock["files"], prefix)
          require(len(historical_locked) == 61
                  and all(historical.get(path) == row for path, row in historical_locked.items()),
                  "historical runtime lock differs from historical distribution")
          historical[distribution_pin["path"]] = distribution_pin
          current = index_rows(descriptor["current_package_files"])
          expected_changes = {prefix + path for path in (
              "README.md", "central/comparisons.py", "central/execute.py", "central/source.py",
              "examples/make_engineering_request.py", "run.py", "tests/test_public_programme.py")}
          require(len(current) == 73 and set(current) == set(historical) | {prefix + "CURRENT_SOURCE_LOCK.json"},
                  "current reward package must preserve all historical paths and add exactly the current lock")
          require({path for path in historical if current[path] != historical[path]} == expected_changes,
                  "current reward source changed outside the reviewed seven-member override")
          changes = descriptor["changed_files"]
          require(len(changes) == 7 and {row["path"] for row in changes} == expected_changes,
                  "current reward override declaration changed")
          for row in changes:
              path = row["path"]
              require(row["predecessor"] == {key: historical[path][key] for key in ("bytes", "sha256")}
                      and row["current"] == {key: current[path][key] for key in ("bytes", "sha256")},
                      "current reward override disagrees with authenticated manifests: " + path)
          require(descriptor["current_source_lock"] == current[prefix + "CURRENT_SOURCE_LOCK.json"],
                  "current reward runtime lock binding changed")
          current_lock = json.loads(read_pin(descriptor["current_source_lock"]))
          require(current_lock["schema"] == "reward_complete_central_current_source_lock_v1"
                  and current_lock["scientific_qualification"] is False
                  and current_lock["authentic_execution_available"] is False,
                  "current runtime source identity or qualification changed")
          require(index_rows(current_lock["files"], prefix) == {
              path: row for path, row in current.items()
              if path not in {prefix + "CURRENT_SOURCE_LOCK.json", prefix + "README.md"}},
              "current runtime lock must bind all 71 required source members")
          for field, pin in (("predecessor_distribution", distribution_pin),
                             ("predecessor_source_lock", historical_lock_pin)):
              require({**current_lock[field], "path": prefix + current_lock[field]["path"]} == pin,
                      "current runtime lock lost historical identity")
          for row in descriptor["canonical_tasks_unchanged"] + descriptor["source_tests"]:
              read_pin(row)

          def verify_current_package():
              actual = set()
              for path in root.rglob("*"):
                  info = path.lstat()
                  require(not stat.S_ISLNK(info.st_mode), "reward package symlink refused: " + str(path))
                  if stat.S_ISREG(info.st_mode):
                      actual.add(path.as_posix())
                  else:
                      require(stat.S_ISDIR(info.st_mode), "reward package special node refused: " + str(path))
              require(actual == set(current), "reward current package namespace changed")
              for row in current.values():
                  read_pin(row)

          verify_current_package()
          spec = importlib.util.spec_from_file_location("reward_public_controls", root / "tests/test_public_programme.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromModule(module)
          require(suite.countTestCases() == 10, "all ten current reward source controls required")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          verify_current_package()
          require(result.testsRun == 10 and result.wasSuccessful() and not result.skipped
                  and not result.expectedFailures and not result.unexpectedSuccesses,
                  "all ten current reward source controls must pass without skips or expected failures")
          REWARD_SOURCE

