      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.18'
      - name: Verify Purkinje PROGRAM source and test execution boundaries
        shell: bash
        working-directory: benchmarks/paper/PAPER-FIND-REP-013/implementations/registered-runtime/program-v1
        run: |
          set -euo pipefail
          umask 077
          PURKINJE_PROGRAM_LOGS="${RUNNER_TEMP}/purkinje-program-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$PURKINJE_PROGRAM_LOGS"
          set +e
          PURKINJE_PROGRAM_FAILED=0
          for PURKINJE_PROGRAM_FILE in verify_source.py source_controls.py ../../artifacts/test_numeric_score.py; do
            PURKINJE_PROGRAM_NAME="${PURKINJE_PROGRAM_FILE##*/}"
            PURKINJE_PROGRAM_ARGS=()
            if [ "$PURKINJE_PROGRAM_FILE" = verify_source.py ]; then PURKINJE_PROGRAM_ARGS=(2021c9d399196a3a19546b5b84a6c2bc67d630a2a6c8b193d0905f2628a291b6); fi
            /usr/bin/timeout --signal=TERM --kill-after=5s 60s python -I -S -B "$PURKINJE_PROGRAM_FILE" "${PURKINJE_PROGRAM_ARGS[@]}" >"$PURKINJE_PROGRAM_LOGS/${PURKINJE_PROGRAM_NAME}.stdout" 2>"$PURKINJE_PROGRAM_LOGS/${PURKINJE_PROGRAM_NAME}.stderr"
            PURKINJE_PROGRAM_STATUS=$?
            printf '%s\n' "$PURKINJE_PROGRAM_STATUS" >"$PURKINJE_PROGRAM_LOGS/${PURKINJE_PROGRAM_NAME}.status"
            cat "$PURKINJE_PROGRAM_LOGS/${PURKINJE_PROGRAM_NAME}.stdout"
            cat "$PURKINJE_PROGRAM_LOGS/${PURKINJE_PROGRAM_NAME}.stderr"
            if [ "$PURKINJE_PROGRAM_STATUS" -ne 0 ]; then PURKINJE_PROGRAM_FAILED=1; fi
          done
          exit "$PURKINJE_PROGRAM_FAILED"
      - name: Preserve Purkinje PROGRAM source control evidence
