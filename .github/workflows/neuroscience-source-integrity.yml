          mkdir -m 700 "$NEURAL_SOURCE_LOGS"
          export PFC_FIXTURE_ROOT="${RUNNER_TEMP}/pfc-fixtures-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
