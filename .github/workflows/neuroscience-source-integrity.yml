  sbind-continuous-normalization-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.6'
      - name: Authenticate SBIND numerical component and shared preparation before imports
        shell: bash
        run: |
          set -euo pipefail
          ulimit -t 60
          ulimit -v 131072
          /usr/bin/timeout --signal=TERM --kill-after=5s 90s python -I -S -B - <<'SBIND_NUMERICAL_SOURCE'
          import hashlib, json, pathlib, stat, sys, unittest
          if sys.flags.optimize:
              raise RuntimeError('source controls require assertions enabled')

          def verified_document(path, extent, digest):
              if any(p.is_symlink() for p in (path, *path.parents)):
                  raise RuntimeError('ordinary source descriptor path required')
              info = path.lstat()
              if not stat.S_ISREG(info.st_mode) or info.st_size != extent:
                  raise RuntimeError('selected source descriptor extent changed')
              raw = path.read_bytes()
              if len(raw) != extent or hashlib.sha256(raw).hexdigest() != digest:
                  raise RuntimeError('selected source descriptor changed')
              return json.loads(raw)

          def rows(document):
              members = document['files']
              names = [item['path'] for item in members]
              if len(names) != 8 or len(names) != len(set(names)) or any(
                      pathlib.PurePosixPath(name).name != name for name in names):
                  raise RuntimeError('exact flat eight-member source namespace required')
              return {item['path']: item for item in members}

          def metadata(document, current=False):
              ignored = {'files', 'current_dependencies'} if current else {'files'}
              return {key: value for key, value in document.items() if key not in ignored}

          def exact_delta(original, selected, changed):
              old_rows, new_rows = rows(original), rows(selected)
              if set(old_rows) != set(new_rows) or {
                      name for name in old_rows if old_rows[name] != new_rows[name]} != changed:
                  raise RuntimeError('current source differs beyond the reviewed repair')

          def authenticate(root, historical_pin, current_path, current_pin, changed,
                           dependency_binding=None, predecessor=None):
              if any(p.is_symlink() for p in (root, *root.parents)) or not stat.S_ISDIR(root.lstat().st_mode):
                  raise RuntimeError('ordinary component directory required')
              original = verified_document(root / 'SOURCE.json', *historical_pin)
              selected = verified_document(current_path, *current_pin)
              if metadata(selected, current=True) != metadata(original):
                  raise RuntimeError('original source metadata must be preserved')
              if dependency_binding is None:
                  if 'current_dependencies' in selected:
                      raise RuntimeError('unexpected current source dependencies')
              elif selected.get('current_dependencies') != dependency_binding:
                  raise RuntimeError('exact reviewed current dependency binding required')
              exact_delta(original, selected, changed)
              if predecessor is not None:
                  predecessor_path, predecessor_pin = predecessor
                  prior = verified_document(predecessor_path, *predecessor_pin)
                  if metadata(prior) != metadata(original):
                      raise RuntimeError('previous source metadata changed')
                  exact_delta(original, prior, {'test_public_delivery.py'})
                  exact_delta(prior, selected, changed)
              members = rows(selected)
              if {path.name for path in root.iterdir()} != set(members) | {'SOURCE.json'}:
                  raise RuntimeError('exact source namespace required before discovery')
              for name, item in members.items():
                  member = root / name
                  info = member.lstat()
                  if not stat.S_ISREG(info.st_mode) or info.st_size != item['bytes']:
                      raise RuntimeError('ordinary source member with exact extent required')
                  body = member.read_bytes()
                  if len(body) != item['bytes'] or hashlib.sha256(body).hexdigest() != item['sha256']:
                      raise RuntimeError('selected source changed before imports: ' + name)

          root = pathlib.Path('benchmarks/paper/PAPER-CANDIDATE-20261114-SBIND/implementations/continuous-normalization')
          dependency = pathlib.Path('benchmarks/paper/PAPER-CANDIDATE-20261114-SBIND/implementations/whole-trial-preparation')
          whole_current = pathlib.Path('benchmarks/integrity/current-closures/input-sbind/WHOLE_TRIAL_SOURCE.json')
          current = pathlib.Path('benchmarks/integrity/current-closures/input-sbind/CONTINUOUS_NORMALIZATION_SOURCE.json')
          previous = pathlib.Path('benchmarks/integrity/current-closures/sbind-continuous-normalization/SOURCE.json')
          authenticate(dependency, (1452, '9110b9ef65bc205e719edd4cfb0d41e5e8edfb6bd6a51a2480ee780a1913e08d'), whole_current, (1453, '19fe75433f4ac67ee15d16ced4d96d906e37d24195270acf9d85cc753a6d5afb'),
              {'trial_preparation.py', 'test_trial_preparation.py', 'test_public_delivery.py'})
          authenticate(root, (1871, 'f07a901cf4d8f9ef44d97909dfd6e730cf57c9cd2ad47e96806f9a6c680ca5ea'), current, (2394, '0e1a2b16275e72e67a3261954612bf99398a0bb29f730b2062699efb68c403cf'),
              {'test_numerical_preparation.py', 'test_public_delivery.py'},
              dependency_binding=[{'path': 'benchmarks/paper/PAPER-CANDIDATE-20261114-SBIND/implementations/whole-trial-preparation', 'source': {'path': 'benchmarks/integrity/current-closures/input-sbind/WHOLE_TRIAL_SOURCE.json', 'bytes': 1453, 'sha256': '19fe75433f4ac67ee15d16ced4d96d906e37d24195270acf9d85cc753a6d5afb'}, 'historical_source': {'bytes': 1452, 'sha256': '9110b9ef65bc205e719edd4cfb0d41e5e8edfb6bd6a51a2480ee780a1913e08d'}}], predecessor=(previous, (1871, '0a126ace920578179e5406bc3fbdd9cfdd135f3360463454868e751200f1d490')))
          sys.path[:0] = [str(root.resolve()), str(dependency.resolve())]
          suite = unittest.defaultTestLoader.discover(str(root), pattern='test_*.py')
          if suite.countTestCases() != 10:
              raise RuntimeError('exactly eight numerical and two delivery methods required')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not (result.testsRun == 10 and result.wasSuccessful() and not result.skipped
                  and not result.expectedFailures and not result.unexpectedSuccesses):
              raise SystemExit(1)
          SBIND_NUMERICAL_SOURCE

