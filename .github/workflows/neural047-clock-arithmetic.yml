              return [node.id()]
          expected_ids = ['test_neural047_clock_arithmetic.ClockArithmetic.test_both_existing_feature_validators_remain_strict', 'test_neural047_clock_arithmetic.ClockArithmetic.test_coarse_clock_excludes_five_second_history_and_two_second_landmark', 'test_neural047_clock_arithmetic.ClockArithmetic.test_complete_generated_panel_keeps_all_animals_events_and_views', 'test_neural047_clock_arithmetic.ClockArithmetic.test_complete_maximal_event_roster_is_still_required', 'test_neural047_clock_arithmetic.ClockArithmetic.test_exact_endpoints_are_inclusive', 'test_neural047_clock_arithmetic.ClockArithmetic.test_existing_endpoint_exclusions_and_sign_are_preserved', 'test_neural047_clock_arithmetic.ClockArithmetic.test_generated_integer_and_fractional_clock_families', 'test_neural047_clock_arithmetic.ClockArithmetic.test_lower_boundary_and_adjacent_represented_values', 'test_neural047_clock_arithmetic.ClockArithmetic.test_missing_channel_at_excluded_lower_sample_is_not_used', 'test_neural047_clock_arithmetic.ClockArithmetic.test_mixed_integer_float_difference_is_rounded_only_once', 'test_neural047_clock_arithmetic.ClockArithmetic.test_native_gap_at_lower_boundary_still_rejects', 'test_neural047_clock_arithmetic.ClockArithmetic.test_new_boundary_exclusion_cannot_silently_drop_an_animal', 'test_neural047_clock_arithmetic.ClockArithmetic.test_ordinary_landmark_waits_for_minimum_elapsed_time', 'test_neural047_clock_arithmetic.ClockArithmetic.test_outside_landmark_and_short_reversal_remain_exclusions', 'test_neural047_clock_arithmetic.ClockArithmetic.test_recording_coverage_uses_exact_boundary', 'test_neural047_clock_arithmetic.ClockArithmetic.test_relative_float_rounding_does_not_expand_membership', 'test_neural047_clock_arithmetic.ClockArithmetic.test_unrepresentable_offsets_abort_extraction_and_whole_panel', 'test_neural047_clock_arithmetic.CurrentSourceBinding.test_current_source_and_predecessor_are_explicitly_distinct', 'test_neural047_clock_arithmetic.RuntimeSourceIdentity.test_changed_manifest_bytes_cannot_retain_selected_manifest_pin', 'test_neural047_clock_arithmetic.RuntimeSourceIdentity.test_changed_source_bytes_cannot_retain_current_identity', 'test_neural047_clock_arithmetic.RuntimeSourceIdentity.test_complete_current_identity_passes_both_existing_source_guards', 'test_neural047_clock_arithmetic.RuntimeSourceIdentity.test_historical_manifest_refuses_corrected_source', 'test_neural047_direction_underflow.DirectionUnderflow.test_exact_zero_remains_excluded', 'test_neural047_direction_underflow.DirectionUnderflow.test_nonzero_tiny_direction_survives_complete_three_animal_construction', 'test_neural047_direction_underflow.DirectionUnderflow.test_opposed_mixed_and_boundary_inputs_retain_exact_mean_sign', 'test_neural047_direction_underflow.DirectionUnderflow.test_ordinary_large_and_tiny_nonzero_signs', 'test_neural047_summary_underflow.SummaryUnderflow.test_constant_and_ordinary_features_preserve_declared_values', 'test_neural047_summary_underflow.SummaryUnderflow.test_representable_tiny_spread_survives_binary64_json_and_active_admission', 'test_neural047_summary_underflow.SummaryUnderflow.test_smallest_representable_standard_deviation']
          actual_ids = sorted(case_ids(suite))
          assert len(actual_ids) == len(set(actual_ids)), 'Duplicate discovered cases refused'
          assert actual_ids == expected_ids, 'Discovered case identities differ from reviewed roster'
          actual_count = suite.countTestCases()
          assert actual_count == 29, f"Expected 29 cases, discovered {actual_count}"
          result = unittest.TextTestRunner(verbosity=2).run(suite)
