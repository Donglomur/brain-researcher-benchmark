          assert actual_count == 22, f"Expected 22 cases, discovered {actual_count}"
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun == 22, f"Expected 22 executed cases, ran {result.testsRun}"
          assert not result.expectedFailures, "Expected-failure tests do not establish completed controls"
          actual_skips = sorted(case.id() for case, _ in result.skipped)
          assert actual_skips == [], f"Unexpected skipped cases: {actual_skips}"
          print(json.dumps({'test_file': 'tests/benchmarks/test_neural047_clock_arithmetic.py', 'tests_run': result.testsRun,
                            'skipped': actual_skips, 'generated_controls_only': True,
                            'scientific_qualification': False}))
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
