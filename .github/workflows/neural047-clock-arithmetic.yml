                  for name in files:
                      relative = (Path(directory) / name).relative_to(root).as_posix()
                      path_for(relative)
                      observed.add(relative)
              assert observed == {p for p in expected if p.startswith(package + '/')}, package
          print(json.dumps({'verified_source_files': len(expected), 'verified_bytes': 213777,
