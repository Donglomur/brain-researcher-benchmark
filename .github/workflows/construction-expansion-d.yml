                  "bytes": 15411,
                  "sha256": "eaf3fbab90deec7380b2fe601e3e361ffcdbca62888acf875e48950423aac6f0"
              },
              {
                  "path": "benchmarks/paper/PAPER-paper-signal-add-013/implementations/initial-evaluator-v1/provenance.json",
                  "bytes": 12332,
                  "sha256": "7aa1eb10f360a50d4a7661fd5a33fc3d25831baf13d009ce9c6e29bec18e397e"
              },
              {
                  "path": "benchmarks/paper/PAPER-paper-signal-add-013/implementations/initial-evaluator-v1/tests/test_evaluator.py",
                  "bytes": 9947,
                  "sha256": "9c4d1461681d179b1244f7394eaa4b259a440811ae081bc7ce8c8632784e6e47"
              },
              {
                  "path": "benchmarks/paper/PAPER-paper-signal-add-013/historical/task.pre-improvement.v1.json",
                  "bytes": 16711,
                  "sha256": "dc4aa310b2265d05b3cfa88b7f8093ebc82cbac96ca6d67628c9c83b899dcd64"
              }
          ]
          packages = [
              "benchmarks/paper/PAPER-ROOT-ADD-021/implementations/initial-evaluator-v1",
              "benchmarks/paper/PAPER-paper-method-010/implementations/initial-evaluator-v1",
              "benchmarks/paper/PAPER-paper-method-020/implementations/initial-evaluator-v1",
              "benchmarks/paper/PAPER-paper-method-032/implementations/initial-evaluator-v1",
              "benchmarks/paper/PAPER-paper-method-050/implementations/initial-evaluator-v1",
              "benchmarks/paper/PAPER-paper-method-add-008/implementations/initial-evaluator-v1",
              "benchmarks/paper/PAPER-paper-method-replacement-012/implementations/initial-evaluator-v1",
              "benchmarks/paper/PAPER-paper-signal-add-013/implementations/initial-evaluator-v1"
          ]
          assert len(rows) == 53 > 0
          assert sum(row['bytes'] for row in rows) == 3030070 <= 33554432
          expected = {}
          def path_for(relative, *, directory=False):
              p = PurePosixPath(relative)
              assert str(p) == relative and not p.is_absolute()
              assert '\\' not in relative and all(x not in ('', '.', '..') for x in relative.split('/'))
              current = root
              for part in p.parts:
                  current = current / part
                  assert not current.is_symlink(), relative
              info = current.lstat()
              assert stat.S_ISDIR(info.st_mode) if directory else stat.S_ISREG(info.st_mode), relative
              return current
          def stamp(info):
              return info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns, info.st_ctime_ns
          for row in rows:
              assert set(row) == {'path', 'bytes', 'sha256'}
              assert row['path'] not in expected
              assert type(row['bytes']) is int and 0 <= row['bytes'] <= 8388608
              assert len(row['sha256']) == 64 and set(row['sha256']) <= set('0123456789abcdef')
              path = path_for(row['path'])
              before = path.lstat()
              assert before.st_nlink == 1 and before.st_size == row['bytes'], row['path']
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              with os.fdopen(fd, 'rb') as stream:
                  opened = os.fstat(stream.fileno())
                  assert stamp(opened) == stamp(before)
                  body = stream.read(row['bytes'] + 1)
                  assert stamp(os.fstat(stream.fileno())) == stamp(opened)
              assert stamp(path_for(row['path']).lstat()) == stamp(before)
              assert len(body) == row['bytes'] and hashlib.sha256(body).hexdigest() == row['sha256'], row['path']
              expected[row['path']] = row
          for package in packages:
              path_for(package, directory=True)
              observed = set()
              for directory, directories, files in os.walk(root / package, followlinks=False):
                  for name in directories:
                      path_for((Path(directory) / name).relative_to(root).as_posix(), directory=True)
                  for name in files:
                      relative = (Path(directory) / name).relative_to(root).as_posix()
                      path_for(relative)
                      observed.add(relative)
              assert observed == {p for p in expected if p.startswith(package + '/')}, package
          print(json.dumps({'verified_source_files': len(expected), 'verified_bytes': 3030070,
                            'complete_new_packages': len(packages), 'generated_controls_only': True,
                            'authentic_data_read': False, 'scientific_qualification': False}))
          PY

  expansion-d-neural-020:
    name: Expansion D NEURAL-020
    needs: expansion-d-source-identities
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.18'
      - name: Install reviewed hash-pinned control dependencies
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/expansion-d-requirements.txt" <<'REQUIREMENTS'
          numpy==2.4.6 --hash=sha256:89cd468399cfd2504718f0ba50e410dca55a170b61a02ad92bb18c8a65186e93
          scipy==1.17.1 --hash=sha256:43af8d1f3bea642559019edfe64e9b11192a8978efbd1539d7bc2aaa23d92de4
          scikit-learn==1.9.1 --hash=sha256:52a0703bbc07ad27f560fa63fa68e4c54dd735bfbbf65b4dd3c225dc7547b6df
          joblib==1.5.3 --hash=sha256:5fc3c5039fc5ca8c0276333a188bbd59d6b7ab37fe6632daa76bc7f9ec18e713
          narwhals==2.23.0 --hash=sha256:769e7b9ab102c93d8fa019f6b4cd1a657909b04a20bf6210e5a35aae06814ae9
          threadpoolctl==3.6.0 --hash=sha256:43a0b8fd5a2928500110039e43a5eed8480b918967083ea48dc3ab9f13c4a7fb
          REQUIREMENTS
          timeout --signal=TERM --kill-after=5s 120s python -I -m pip install --disable-pip-version-check --no-cache-dir --force-reinstall --only-binary=:all: --no-deps --require-hashes -r "${RUNNER_TEMP}/expansion-d-requirements.txt"
      - name: Verify installed dependency versions
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 30s python -I -B - <<'PY'
          import importlib.metadata
          import json
          expected = {'numpy': '2.4.6', 'scipy': '1.17.1', 'scikit-learn': '1.9.1', 'joblib': '1.5.3', 'narwhals': '2.23.0', 'threadpoolctl': '3.6.0'}
          actual = {name: importlib.metadata.version(name) for name in expected}
          assert actual == expected, actual
          print(json.dumps({'verified_dependency_versions': actual}))
          PY
      - name: Generated controls (test_evaluator.py)
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s python -I -B - <<'PY'
          import importlib.util
          import json
          import sys
          import unittest
          assert all(importlib.util.find_spec(name) is None for name in []), "Unexpected optional dependency changes negative-path controls"
          suite = unittest.defaultTestLoader.discover('benchmarks/neural/NEURAL-020/implementations/initial-evaluator-v1/tests', pattern='test_evaluator.py')
          def flatten(value):
              for case in value:
                  if isinstance(case, unittest.TestSuite):
                      yield from flatten(case)
                  else:
                      yield case
          expected_ids = ['test_evaluator.ArchiveControls.test_reject_declared_allocation_bomb', 'test_evaluator.ArchiveControls.test_reject_object_arrays', 'test_evaluator.MetricControls.test_does_not_mutate_zero_rates', 'test_evaluator.MetricControls.test_exact_zero_and_tiny_positive_are_different', 'test_evaluator.MetricControls.test_independently_derived_scalar_values', 'test_evaluator.MetricControls.test_null_is_evaluation_mean', 'test_evaluator.MetricControls.test_official_byte_pinned_parity', 'test_evaluator.MetricControls.test_reject_malformed_counts_and_rates', 'test_evaluator.MetricControls.test_zero_total_is_explicit_undefined', 'test_evaluator.PacketControls.test_cli_round_trip_and_no_overwrite', 'test_evaluator.PacketControls.test_complete_projection_and_privacy', 'test_evaluator.PacketControls.test_condition_normalization_not_pooled_average', 'test_evaluator.PacketControls.test_constant_outputs_are_valid_diagnostic_not_disqualified', 'test_evaluator.PacketControls.test_digest_changes_with_payload', 'test_evaluator.PacketControls.test_fixed_unit_mask_changes_bound_identity', 'test_evaluator.PacketControls.test_missingness_cannot_remove_unit_condition', 'test_evaluator.PacketControls.test_population_and_source_identity_fail_closed', 'test_evaluator.PacketControls.test_smoothing_rejects_unsupported_missingness_and_zero_training_unit', 'test_evaluator.PacketControls.test_smoothing_source_recipe_constant_target_control', 'test_evaluator.PacketControls.test_submission_identity_order_units_and_private_fields', 'test_evaluator.PacketControls.test_training_mean_does_not_read_query_or_eval_targets', 'test_evaluator.PacketControls.test_whole_block_and_time_overlap_rejected']
          actual_ids = sorted(case.id() for case in flatten(suite))
          assert actual_ids == expected_ids, (actual_ids, expected_ids)
          actual_count = suite.countTestCases()
          assert actual_count == 22 > 0, actual_count
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun == 22, result.testsRun
          assert not result.skipped, result.skipped
