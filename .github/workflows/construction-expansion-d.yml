          assert len(rows) == 58 > 0
          assert sum(row['bytes'] for row in rows) == 636344 <= 33554432
          expected = {}
          def path_for(relative, *, directory=False):
              p = PurePosixPath(relative)
              assert str(p) == relative and not p.is_absolute()
              assert '\\' not in relative and all(x not in ('', '.', '..') for x in relative.split('/'))
              current = root
              for part in p.parts:
                  current = current / part
                  assert not current.is_symlink(), relative
              info = current.lstat()
              assert stat.S_ISDIR(info.st_mode) if directory else stat.S_ISREG(info.st_mode), relative
              return current
          def stamp(info):
              return info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns, info.st_ctime_ns
