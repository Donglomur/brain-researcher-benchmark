name: Construction expansion D

on:
  pull_request:
    branches: [publish/neuroscience-200]
  push:
    branches: [publish/neuroscience-200]

permissions:
  contents: read

concurrency:
  group: construction-expansion-d-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  PYTEST_ADDOPTS: ''
  PYTEST_PLUGINS: ''

# Source identity checks retain original PAPER task bytes as historical calibration evidence.
# Same-task improvement success is defined by the current task and its improvement contract.
jobs:
  source-preflight:
    uses: ./.github/workflows/source-maintenance-preflight.yml
  expansion-d-source-identities:
    needs: source-preflight
    name: Expansion D source identities
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.18'
      - name: Verify reviewed identities and complete package closure (batch 1)
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 90s python -I -S -B - <<'PY'
