name: Retina construction controls

'on':
  pull_request:
  push:
    branches: ['publish/neuroscience-200']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-preflight:
    uses: ./.github/workflows/source-maintenance-preflight.yml
  invented-retina-controls:
    needs: source-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.18'
      - name: Run seventy-six invented offline controls
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          RETINA_CONTROL_ROOT="/tmp/retina-construction-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$RETINA_CONTROL_ROOT"
          set +e
          /usr/bin/timeout --signal=TERM --kill-after=5s 40s python -I -S -B benchmarks/shared/retina-coding/construction/run_offline_controls.py >"$RETINA_CONTROL_ROOT/stdout.log" 2>"$RETINA_CONTROL_ROOT/stderr.log"
          RETINA_CONTROL_STATUS=$?
          set -e
          printf '%s\n' "$RETINA_CONTROL_STATUS" >"$RETINA_CONTROL_ROOT/exit-status.txt"
          exit "$RETINA_CONTROL_STATUS"
      - name: Retain complete control streams and exit status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retina-construction-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          path: /tmp/retina-construction-${{ github.run_id }}-${{ github.run_attempt }}/
