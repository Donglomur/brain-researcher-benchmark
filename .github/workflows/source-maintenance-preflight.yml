name: Source maintenance preflight

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.18'
      - name: Verify every workflow source pin before package jobs
        run: python -I -S -B scripts/maintenance/workflow_source_pins.py --output /tmp/workflow-source-audit.json
      - name: Verify enrolled current and historical source semantics
        run: python -I -S -B scripts/check_source_integrity.py
      - name: Verify source maintenance rejection controls
        run: python -I -S -B -m unittest discover -s tests/maintenance -p 'test_workflow_source_pins.py' -v
