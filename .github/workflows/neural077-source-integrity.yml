# Source controls only; no private data, Docker or native qualification.
name: NEURAL077 current source integrity

on:
  pull_request:
    paths:
      - 'benchmarks/neural/NEURAL-077/implementations/registered-runtime/**'
      - 'benchmarks/neural/NEURAL-077/implementations/visual-transport-v1/**'
      - 'benchmarks/neural/NEURAL-077/implementations/visual-viewer-v1/**'
      - 'benchmarks/neural/NEURAL-077/implementations/direct-response/**'
      - 'benchmarks/integrity/source-ownership.json'
      - 'tests/benchmarks/test_neural077_source_integrity.py'
      - '.github/workflows/neural077-source-integrity.yml'
  push:
    paths:
      - 'benchmarks/neural/NEURAL-077/implementations/registered-runtime/**'
      - 'benchmarks/neural/NEURAL-077/implementations/visual-transport-v1/**'
      - 'benchmarks/neural/NEURAL-077/implementations/visual-viewer-v1/**'
      - 'benchmarks/neural/NEURAL-077/implementations/direct-response/**'
      - 'benchmarks/integrity/source-ownership.json'
      - 'tests/benchmarks/test_neural077_source_integrity.py'
      - '.github/workflows/neural077-source-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neural077-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  source-preflight:
    uses: ./.github/workflows/source-maintenance-preflight.yml
  current-source-controls:
    needs: source-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.18'
      - name: Authenticate reviewed control and successor descriptor
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 30s python -I -S -B - <<'PY'
          import hashlib
          from pathlib import Path
          pins = {
              'tests/benchmarks/test_neural077_source_integrity.py':
                  (10921, '51ed86053cb7b2d6186f37e65c83ac5c56730fe7a077639b21946ed8be1139f6'),
              'benchmarks/neural/NEURAL-077/implementations/registered-runtime/CURRENT_SOURCE.json':
                  (2479, 'd72583caeec307b51254fd541ee5bf9e8ee0de407ef692d0dbcefcfde6ed4544'),
          }
          for name, pin in pins.items():
              path = Path(name)
              if path.is_symlink() or not path.is_file() or path.stat().st_nlink != 1 or path.stat().st_size != pin[0]:
                  raise SystemExit('Invalid reviewed source file: ' + name)
              body = path.read_bytes()
              if (len(body), hashlib.sha256(body).hexdigest()) != pin:
                  raise SystemExit('Reviewed source pin changed: ' + name)
          PY
      - name: Check complete source and generated failure controls
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 60s python -I -S -B -m unittest discover -s tests/benchmarks -p test_neural077_source_integrity.py -v 2>&1 | tee "$RUNNER_TEMP/neural077-source-integrity.log"
          timeout --signal=TERM --kill-after=5s 90s python -I -S -B scripts/check_repository.py 2>&1 | tee -a "$RUNNER_TEMP/neural077-source-integrity.log"
      - name: Check generated image transport controls
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 90s python -I -S -B benchmarks/neural/NEURAL-077/implementations/visual-transport-v1/test_transport.py -v 2>&1 | tee -a "$RUNNER_TEMP/neural077-source-integrity.log"
      - name: Preserve source control evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neural077-source-integrity-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: ${{ runner.temp }}/neural077-source-integrity.log
