name: Consensus occurrence controls

'on':
  pull_request:
  push:
    branches: ['publish/neuroscience-200']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-preflight:
    uses: ./.github/workflows/source-maintenance-preflight.yml
  invented-occurrence-controls:
    needs: source-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.18'
      - name: Run twenty-seven invented occurrence controls
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          CONSENSUS_CONTROL_ROOT="/tmp/consensus-occurrences-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$CONSENSUS_CONTROL_ROOT"
          set +e
          /usr/bin/timeout --signal=TERM --kill-after=5s 35s python -I -S -B benchmarks/paper/PAPER-CANDIDATE-20261114-CONSENSUS/implementations/trial-occurrences/run_invented_controls.py >"$CONSENSUS_CONTROL_ROOT/stdout.log" 2>"$CONSENSUS_CONTROL_ROOT/stderr.log"
          CONSENSUS_CONTROL_STATUS=$?
          set -e
          printf '%s\n' "$CONSENSUS_CONTROL_STATUS" >"$CONSENSUS_CONTROL_ROOT/exit-status.txt"
          exit "$CONSENSUS_CONTROL_STATUS"
      - name: Retain complete control streams and exit status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consensus-occurrences-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          path: /tmp/consensus-occurrences-${{ github.run_id }}-${{ github.run_attempt }}/
