# Bounded generated engineering controls; no scientific qualification is established.
name: Construction expansion A

on:
  pull_request:
    branches: [publish/neuroscience-200]
  push:
    branches: [publish/neuroscience-200]

permissions:
  contents: read

concurrency:
  group: construction-expansion-a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

# Source identity checks retain original PAPER task bytes as historical calibration evidence.
# Same-task improvement success is defined by the current task and its improvement contract.
jobs:
  source-preflight:
    uses: ./.github/workflows/source-maintenance-preflight.yml
  construction-a-neural-011:
    needs: source-preflight
    name: construction-a-neural-011
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.18'
      - name: Verify reviewed source identities and complete package closure
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 90s python -I -S -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import stat

          root = Path('.').absolute()
          rows = [
              {
                  "path": "benchmarks/neural/NEURAL-011/docs/initial-evaluator-v1.md",
                  "bytes": 12051,
                  "sha256": "d060e5745de096105161bf225df0d2cf12aeddb318480685ee1782da9cc10590"
              },
              {
                  "path": "benchmarks/neural/NEURAL-011/implementations/initial-evaluator-v1/README.md",
                  "bytes": 1902,
                  "sha256": "ceb6c19498583a357dc40ee7ef922dce162080bd2df199b8c28d08198b77b60e"
              },
              {
                  "path": "benchmarks/neural/NEURAL-011/implementations/initial-evaluator-v1/provenance.json",
                  "bytes": 4245,
                  "sha256": "1a76340f9115fad6fd41aa4d3008ec0ece25eb34a014f6c54fb120c983445eaf"
              },
              {
                  "path": "benchmarks/neural/NEURAL-011/implementations/initial-evaluator-v1/reference.py",
                  "bytes": 9291,
                  "sha256": "15549e34fb72d1ee4976060730af3cfeeb2be6285acc72a4e661c375e3ae1340"
              },
              {
                  "path": "benchmarks/neural/NEURAL-011/implementations/initial-evaluator-v1/siena_evaluator.py",
                  "bytes": 21119,
                  "sha256": "de9f34b9d9399ae34210e55d39047c6ab1f4371d345c68ba15846c839d05aa16"
              },
              {
                  "path": "benchmarks/neural/NEURAL-011/implementations/initial-evaluator-v1/source_inventory.json",
                  "bytes": 7820,
                  "sha256": "4d4ae5ae132d851bea2a2388965dbc0b528e533b4f9cbea97e5822ab660203ea"
              },
              {
                  "path": "benchmarks/neural/NEURAL-011/implementations/initial-evaluator-v1/tests/independent_controls.json",
                  "bytes": 5540,
                  "sha256": "48ca2f572f386d129dd676f37a4819120008cd649277b11409ab5d20416f2f88"
              },
              {
                  "path": "benchmarks/neural/NEURAL-011/implementations/initial-evaluator-v1/tests/test_evaluator.py",
                  "bytes": 11634,
                  "sha256": "89bce9f6189214e2c2011699271aabca8fdf4dc2985b7944b16f8be6fe03103a"
              },
              {
                  "path": "benchmarks/neural/NEURAL-011/historical/task.pre-understanding.v1.json",
                  "bytes": 13904,
                  "sha256": "044340155db14895d22a711e2a892261d0377603714125502e911dd7181fd0ea"
              }
          ]
          packages = [
              "benchmarks/neural/NEURAL-011/implementations/initial-evaluator-v1"
          ]
          assert len(rows) == 9 > 0
          assert sum(row['bytes'] for row in rows) == 87506 <= 33554432
          expected = {}
          def path_for(relative, *, directory=False):
              p = PurePosixPath(relative)
              assert str(p) == relative and not p.is_absolute()
              assert '\\' not in relative and all(x not in ('', '.', '..') for x in relative.split('/'))
              current = root
              for part in p.parts:
                  current = current / part
                  assert not current.is_symlink(), relative
              info = current.lstat()
              assert stat.S_ISDIR(info.st_mode) if directory else stat.S_ISREG(info.st_mode), relative
              return current
          def stamp(info):
              return info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns, info.st_ctime_ns
          for row in rows:
              assert set(row) == {'path', 'bytes', 'sha256'}
              assert row['path'] not in expected
              assert type(row['bytes']) is int and 0 <= row['bytes'] <= 8388608
              assert len(row['sha256']) == 64 and set(row['sha256']) <= set('0123456789abcdef')
              path = path_for(row['path'])
              before = path.lstat()
              assert before.st_nlink == 1 and before.st_size == row['bytes'], row['path']
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              with os.fdopen(fd, 'rb') as stream:
                  opened = os.fstat(stream.fileno())
                  assert stamp(opened) == stamp(before)
                  body = stream.read(row['bytes'] + 1)
                  assert stamp(os.fstat(stream.fileno())) == stamp(opened)
              assert stamp(path_for(row['path']).lstat()) == stamp(before)
              assert len(body) == row['bytes'] and hashlib.sha256(body).hexdigest() == row['sha256'], row['path']
              expected[row['path']] = row
          for package in packages:
              path_for(package, directory=True)
              observed = set()
              for directory, directories, files in os.walk(root / package, followlinks=False):
                  for name in directories:
                      path_for((Path(directory) / name).relative_to(root).as_posix(), directory=True)
                  for name in files:
                      relative = (Path(directory) / name).relative_to(root).as_posix()
                      path_for(relative)
                      observed.add(relative)
              assert observed == {p for p in expected if p.startswith(package + '/')}, package
          print(json.dumps({'verified_source_files': len(expected), 'verified_bytes': 87506,
                            'complete_new_packages': len(packages), 'generated_controls_only': True,
                            'authentic_data_read': False, 'scientific_qualification': False}))
          PY
      - name: Install reviewed exact binary wheels
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/construction-a-neural-011-requirements.txt" <<'REQUIREMENTS'
          numpy==2.4.6 --hash=sha256:89cd468399cfd2504718f0ba50e410dca55a170b61a02ad92bb18c8a65186e93
          REQUIREMENTS
          timeout --signal=TERM --kill-after=5s 120s python -I -m pip --isolated install --disable-pip-version-check --index-url https://pypi.org/simple --only-binary=:all: --no-deps --require-hashes --no-cache-dir --force-reinstall -r "${RUNNER_TEMP}/construction-a-neural-011-requirements.txt"
      - name: Verify installed dependency versions
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 30s python -I -B - <<'PY'
          import importlib.metadata
          import json
          import sys
          assert sys.version_info[:2] == (3, 11)
          expected = {'numpy': '2.4.6'}
          observed = {name: importlib.metadata.version(name) for name in expected}
          assert observed == expected, (observed, expected)
          print(json.dumps({'verified_dependency_versions': observed}))
          PY
      - name: Exact generated controls test_evaluator.py
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s python -I -B - <<'PY'
          import json
          import sys
          import unittest
          from pathlib import Path
          assert sys.version_info[:2] == (3, 11)
          suite = unittest.defaultTestLoader.discover('benchmarks/neural/NEURAL-011/implementations/initial-evaluator-v1/tests', pattern='test_evaluator.py')
          def case_ids(item):
              if isinstance(item, unittest.TestSuite):
                  return [value for child in item for value in case_ids(child)]
              return [item.id()]
          expected_ids = ['test_evaluator.AnnotationTests.test_ambiguous_clocks_follow_pinned_final_clock', 'test_evaluator.AnnotationTests.test_midnight_pn01_alias_and_two_events', 'test_evaluator.AnnotationTests.test_missing_does_not_mean_background', 'test_evaluator.AnnotationTests.test_pn12_repeated_registration', 'test_evaluator.AnnotationTests.test_source_correction', 'test_evaluator.ManifestTests.test_complete_scores_and_nonfinite', 'test_evaluator.ManifestTests.test_constant_scores_retained_as_controls', 'test_evaluator.ManifestTests.test_full_patient_inventory', 'test_evaluator.ManifestTests.test_identity_and_leakage', 'test_evaluator.MetricsTests.test_boundary_events', 'test_evaluator.MetricsTests.test_independently_derived_controls', 'test_evaluator.MetricsTests.test_invalid_events_and_vectors', 'test_evaluator.MetricsTests.test_paired_patient_uncertainty', 'test_evaluator.MetricsTests.test_patient_macro_not_recording_or_event_pool', 'test_evaluator.MetricsTests.test_subtick_alarm_is_false_alarm_as_native', 'test_evaluator.ReferenceTests.test_causal_signal_transform', 'test_evaluator.ReferenceTests.test_cli_roundtrip', 'test_evaluator.ReferenceTests.test_complete_train_predict_score', 'test_evaluator.ReferenceTests.test_timing_only_and_paired_comparison', 'test_evaluator.ReferenceTests.test_training_patient_labels_channels_and_frozen_tamper']
          assert sorted(case_ids(suite)) == expected_ids, "Discovered case identities differ from reviewed roster"
          assert suite.countTestCases() == 20 > 0
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun == 20, "Executed case count differs from reviewed roster"
          assert not result.skipped, "Skipped controls are forbidden"
          assert not result.expectedFailures, "Expected failures are forbidden"
          assert not result.unexpectedSuccesses, "Unexpected successes are forbidden"
          print(json.dumps({'test_file': 'benchmarks/neural/NEURAL-011/implementations/initial-evaluator-v1/tests/test_evaluator.py', 'tests_run': result.testsRun,
                            'skipped': len(result.skipped), 'generated_controls_only': True,
                            'scientific_qualification': False}))
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
