name: Hybrid causal prediction synthetic controls

on:
  pull_request:
    paths:
      - 'benchmarks/neuroscience/hybrid-causal-controls-v1/**'
      - '.github/workflows/hybrid-causal-controls.yml'
  push:
    branches: ['publish/neuroscience-200']
    paths:
      - 'benchmarks/neuroscience/hybrid-causal-controls-v1/**'
      - '.github/workflows/hybrid-causal-controls.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complete-synthetic-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.18'
      - name: Install the single public numerical dependency
        run: |-
          python -I -m pip --isolated install --disable-pip-version-check --no-cache-dir --only-binary=:all: --no-deps numpy==2.2.6
      - name: Run all 31 invented causal and scoring controls
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          HYBRID_CONTROL_ROOT="/tmp/hybrid-causal-controls-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          HYBRID_CONTROL_SOURCE="$GITHUB_WORKSPACE/benchmarks/neuroscience/hybrid-causal-controls-v1"
          mkdir -m 700 "$HYBRID_CONTROL_ROOT"
          set +e
          /usr/bin/timeout --signal=TERM --kill-after=5s 50s python -I -B -c 'import hashlib,os,pathlib,stat,sys; p=pathlib.Path(sys.argv[1]); f=os.open(p,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK); z=os.fstat(f); assert stat.S_ISREG(z.st_mode) and z.st_nlink==1 and z.st_size==int(sys.argv[2]) and z.st_size<1048576; b=os.read(f,z.st_size+1); os.close(f); assert len(b)==int(sys.argv[2]) and hashlib.sha256(b).hexdigest()==sys.argv[3]; sys.argv=[str(p)]+sys.argv[4:]; exec(compile(b,str(p),"exec"),{"__name__":"__main__","__file__":str(p)})' "$HYBRID_CONTROL_SOURCE/run_controls.py" 10306 e7544ed4775cab428dc1c19b908b0fd2f621cd41cc8dba9af239853819e3de95 --out "$HYBRID_CONTROL_ROOT/artifact" --selection-sha256 e9997b264cf7bd7a4f0e7be2d5847d84cc35d7f5db93bb2edd04256d3e16acbe >"$HYBRID_CONTROL_ROOT/stdout.log" 2>"$HYBRID_CONTROL_ROOT/stderr.log"
          HYBRID_CONTROL_STATUS=$?
          set -e
          printf '%s\n' "$HYBRID_CONTROL_STATUS" >"$HYBRID_CONTROL_ROOT/exit-status.txt"
          exit "$HYBRID_CONTROL_STATUS"
      - name: Retain the complete control outcome and original streams
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hybrid-causal-controls-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          path: /tmp/hybrid-causal-controls-${{ github.run_id }}-${{ github.run_attempt }}/
