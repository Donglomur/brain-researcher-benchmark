        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s python -I -B - <<'PY'
          import json
          import sys
          import unittest
          suite = unittest.defaultTestLoader.discover('tests/construction', pattern='test_meg_nested.py')
          actual_count = suite.countTestCases()
          assert actual_count == 35, f"Expected 35 cases, discovered {actual_count}"
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun == 35, f"Expected 35 executed cases, ran {result.testsRun}"
          assert not result.expectedFailures, "Expected-failure tests do not establish completed controls"
          actual_skips = sorted(case.id() for case, _ in result.skipped)
          assert actual_skips == [], f"Unexpected skipped cases: {actual_skips}"
          print(json.dumps({'test_file': 'tests/construction/test_meg_nested.py', 'tests_run': result.testsRun,
