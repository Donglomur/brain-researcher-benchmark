              need(value['trust_scope'] == 'Trusted checked-out CLI plus its hardcoded immutable pins; descriptor coherence only',
                   'trust scope differs')
              accounting = value['fixture_accounting']
              expected_accounting = {'control_cumulative_write_bytes_including_tamper_restores',
                  'cli_error_receipt_bytes', 'aggregate_fixture_write_cap_bytes', 'fixture_copy_and_receipt_read_bytes',
                  'source_verifier_reads_metered_by_this_counter', 'relocated_checkout_count', 'original_array_bytes_read'}
              need(type(accounting) is dict and set(accounting) == expected_accounting, 'fixture accounting fields differ')
              for key in expected_accounting - {'source_verifier_reads_metered_by_this_counter'}:
                  need(type(accounting[key]) is int and accounting[key] >= 0, 'nonnegative integer accounting required')
              writes = accounting['control_cumulative_write_bytes_including_tamper_restores']
              errors = accounting['cli_error_receipt_bytes']
              need(writes <= 491520 and errors <= 32768 and writes + errors <= 524288, 'fixture writes exceed bound')
              need(accounting['aggregate_fixture_write_cap_bytes'] == 524288
                   and accounting['fixture_copy_and_receipt_read_bytes'] <= 1048576
                   and accounting['source_verifier_reads_metered_by_this_counter'] is False
                   and accounting['relocated_checkout_count'] == 1
                   and accounting['original_array_bytes_read'] == 0, 'fixture scope differs')
              return value

          temporary_root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          if any(path.is_symlink() for path in (temporary_root, *temporary_root.parents)):
              raise ValueError('noncanonical temporary root')
          run_id = os.environ['GITHUB_RUN_ID']
          attempt = os.environ['GITHUB_RUN_ATTEMPT']
          if not run_id.isdecimal() or not attempt.isdecimal():
              raise ValueError('numeric run identity required')
          suffix = run_id + '-' + attempt
          scratch = temporary_root / ('calcium-portable-scratch-' + suffix)
          evidence = temporary_root / ('calcium-portable-evidence-' + suffix)
          scratch.mkdir(mode=0o700, exist_ok=False)
          evidence.mkdir(mode=0o700, exist_ok=False)
          log = evidence / 'result.stdout.json'
          # One bounded regular capture; partial output is retained on timeout or failure.
          resource.setrlimit(resource.RLIMIT_FSIZE, (1048576, 1048576))
          environment = dict(os.environ)
          for name in ('OMP_NUM_THREADS', 'OPENBLAS_NUM_THREADS', 'MKL_NUM_THREADS', 'VECLIB_MAXIMUM_THREADS',
                       'NUMEXPR_NUM_THREADS', 'BLIS_NUM_THREADS', 'POLARS_MAX_THREADS', 'RAYON_NUM_THREADS'):
              environment[name] = '1'
          with log.open('xb') as stream:
              result = subprocess.run([sys.executable, '-I', '-S', '-B', str(package / 'test_portable.py'),
                  '--scratch-dir', str(scratch)], cwd=source_root, env=environment,
                  stdout=stream, stderr=subprocess.STDOUT, timeout=60, check=False)
          with log.open('rb') as stream:
              report = stream.read(1048577)
          if result.returncode != 0:
              raise ValueError('portable command failed; preserve the complete capture')
          validate_result(report)
          print(json.dumps({'status': 'passed', 'custom_cases': 10, 'scientific_qualification': False}))
          PY
      - name: Retain calcium control output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: calcium-session-portable-controls
          path: ${{ runner.temp }}/calcium-portable-evidence-${{ github.run_id }}-${{ github.run_attempt }}/result.stdout.json
          if-no-files-found: warn
          retention-days: 14
