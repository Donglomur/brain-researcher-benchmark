                  'MaterialBindingControls.test_owner_source_rejects_stale_episode_dependency',
              ],
          }
          suite = unittest.TestSuite()
          for index, (relative, names) in enumerate(selection.items()):
              spec = importlib.util.spec_from_file_location('smc_material_binding_controls_' + str(index), base / relative)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              for name in names:
                  cls, method = name.split('.')
                  suite.addTest(getattr(module, cls)(method))
          assert suite.countTestCases() == 8
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun == 8 and not result.skipped and result.wasSuccessful()
