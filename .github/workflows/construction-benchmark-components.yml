          # Authenticate both directly imported test sources before the unchanged tested loader.
          import hashlib
          import os
          from pathlib import Path
          import stat
          
          source_root = Path('.').absolute()
          source_rows = [
              {
                  "path": "benchmarks/paper/PAPER-SMC-RNN-2024/implementations/aggregate-episode-v1/test_episode.py",
                  "bytes": 19275,
                  "sha256": "80b0ce2b91dd398db95fccc26dc63e233bdb6d0c87dad90a41e9912f3a586aa5"
              },
              {
                  "path": "benchmarks/paper/PAPER-SMC-RNN-2024/implementations/aggregate-owner-v1/test_aggregate_owner.py",
                  "bytes": 29974,
                  "sha256": "ae1b6d9a1e003007c8b4667a91ddcd15b8741b797b120fcb576b57bff9b7c959"
              }
          ]
          for row in source_rows:
              path = source_root / row['path']
              if any(parent.is_symlink() for parent in (path, *path.parents)):
                  raise ValueError('symlink in selected control source path')
              with os.fdopen(os.open(path, os.O_RDONLY | os.O_NOFOLLOW), 'rb') as stream:
                  before = os.fstat(stream.fileno())
                  if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or before.st_size != row['bytes']:
                      raise ValueError('selected control source type/extent differs')
                  body = stream.read(row['bytes'] + 1)
                  after = os.fstat(stream.fileno())
              fields = ('st_dev', 'st_ino', 'st_size', 'st_mtime_ns', 'st_ctime_ns')
              if any(getattr(before, field) != getattr(after, field) for field in fields):
                  raise ValueError('selected control source changed during read')
              if len(body) != row['bytes'] or hashlib.sha256(body).hexdigest() != row['sha256']:
                  raise ValueError('selected control source identity differs')
          
          """Exact eight stdlib source controls; no data or native execution."""
          import importlib.util
          from pathlib import Path
          import sys
          import unittest
          
          root = Path(sys.argv[1]).resolve()
          base = root / 'benchmarks/paper/PAPER-SMC-RNN-2024/implementations'
          selection = {
