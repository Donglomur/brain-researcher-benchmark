              },
              {
                  "path": "tests/construction/test_calcium_pipeline.py",
                  "bytes": 48149,
                  "sha256": "6630ac4468773d61550e193eaef820fa54a9524ee94d8169f32b0781458fb7a0"
              },
              {
                  "path": "tests/construction/test_meg_nested.py",
                  "bytes": 35906,
                  "sha256": "3f59988324fb23b92a2b7d9abdcdef16aa8deefd5795f91cf52d172f0e6cc7fe"
              },
              {
                  "path": "tests/construction/test_typing_v1.py",
                  "bytes": 26713,
                  "sha256": "005fedc38371f6b63794cba58b30ae5978488995b9ccb14cd5b24fecdaa97983"
              }
          ]
          packages = [
              "benchmarks/neural/NEURAL-025/implementations/train-only-decoding-v1",
              "benchmarks/paper/PAPER-ROOT-ADD-002/implementations/v1-transcript-evaluation-v1",
              "benchmarks/paper/PAPER-paper-method-add-010/implementations/nested-connectivity-v1"
          ]
          assert len(rows) == 31 > 0
          assert sum(row['bytes'] for row in rows) == 673353 <= 33554432
          expected = {}
          def path_for(relative, *, directory=False):
              p = PurePosixPath(relative)
              assert str(p) == relative and not p.is_absolute()
              assert '\\' not in relative and all(x not in ('', '.', '..') for x in relative.split('/'))
              current = root
              for part in p.parts:
                  current = current / part
                  assert not current.is_symlink(), relative
              info = current.lstat()
              assert stat.S_ISDIR(info.st_mode) if directory else stat.S_ISREG(info.st_mode), relative
              return current
          def stamp(info):
              return info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns, info.st_ctime_ns
          for row in rows:
              assert set(row) == {'path', 'bytes', 'sha256'}
              assert row['path'] not in expected
              assert type(row['bytes']) is int and 0 <= row['bytes'] <= 8388608
              assert len(row['sha256']) == 64 and set(row['sha256']) <= set('0123456789abcdef')
              path = path_for(row['path'])
              before = path.lstat()
              assert before.st_nlink == 1 and before.st_size == row['bytes'], row['path']
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              with os.fdopen(fd, 'rb') as stream:
                  opened = os.fstat(stream.fileno())
                  assert stamp(opened) == stamp(before)
                  body = stream.read(row['bytes'] + 1)
                  assert stamp(os.fstat(stream.fileno())) == stamp(opened)
              assert stamp(path_for(row['path']).lstat()) == stamp(before)
              assert len(body) == row['bytes'] and hashlib.sha256(body).hexdigest() == row['sha256'], row['path']
              expected[row['path']] = row
          for package in packages:
              path_for(package, directory=True)
              observed = set()
              for directory, directories, files in os.walk(root / package, followlinks=False):
                  for name in directories:
                      path_for((Path(directory) / name).relative_to(root).as_posix(), directory=True)
                  for name in files:
                      relative = (Path(directory) / name).relative_to(root).as_posix()
                      path_for(relative)
                      observed.add(relative)
              assert observed == {p for p in expected if p.startswith(package + '/')}, package
          print(json.dumps({'verified_source_files': len(expected), 'verified_bytes': 673353,
                            'complete_new_packages': len(packages), 'generated_controls_only': True,
                            'authentic_data_read': False, 'scientific_qualification': False}))
          PY

