name: NIDER ARM64 environment observation proposal

on:
  push:
    branches:
      - publish/nider-arm64-owner-admission-20261114

permissions:
  contents: read

concurrency:
  group: nider-arm64-owner-admission-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nider-arm64-environment-observation:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.18'
      - name: Observe Linux owner and local Docker metadata without changing them
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ulimit -f 64
          NIDER_HOST_ROOT="/tmp/nider-arm64-admission-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$NIDER_HOST_ROOT"
          NIDER_HOST_FAIL=0
          set +e
          /usr/bin/timeout --signal=TERM --kill-after=2s 10s python -I -S -B -c 'import json,os,pathlib,platform,shutil; p=pathlib.Path(os.environ["RUNNER_TEMP"]); print(json.dumps({"system":platform.system(),"machine":platform.machine(),"uid":os.geteuid(),"gid":os.getegid(),"cpu_count":os.cpu_count(),"temporary_root_free_bytes":shutil.disk_usage(p).free,"uid_map":pathlib.Path("/proc/self/uid_map").read_text(),"gid_map":pathlib.Path("/proc/self/gid_map").read_text(),"docker_environment_present":[k for k in ("DOCKER_HOST","DOCKER_CONTEXT","DOCKER_TLS_VERIFY","DOCKER_CERT_PATH") if k in os.environ]},sort_keys=True)); assert platform.system()=="Linux" and platform.machine() in ("aarch64","arm64") and os.geteuid()>0 and os.getegid()>0' >"$NIDER_HOST_ROOT/host.stdout" 2>"$NIDER_HOST_ROOT/host.stderr"
          NIDER_HOST_STATUS=$?
          printf '%s\n' "$NIDER_HOST_STATUS" >"$NIDER_HOST_ROOT/host.status"
          if [ "$NIDER_HOST_STATUS" -ne 0 ]; then NIDER_HOST_FAIL=1; fi
          /usr/bin/timeout --signal=TERM --kill-after=2s 10s docker context inspect --format '{{json .Endpoints.docker}}' >"$NIDER_HOST_ROOT/context.stdout" 2>"$NIDER_HOST_ROOT/context.stderr"
          NIDER_CONTEXT_STATUS=$?
          printf '%s\n' "$NIDER_CONTEXT_STATUS" >"$NIDER_HOST_ROOT/context.status"
          if [ "$NIDER_CONTEXT_STATUS" -ne 0 ]; then NIDER_HOST_FAIL=1; fi
          /usr/bin/timeout --signal=TERM --kill-after=2s 10s docker info --format '{"OSType":{{json .OSType}},"Architecture":{{json .Architecture}},"NCPU":{{json .NCPU}},"MemTotal":{{json .MemTotal}},"DockerRootDir":{{json .DockerRootDir}},"SecurityOptions":{{json .SecurityOptions}}}' >"$NIDER_HOST_ROOT/docker.stdout" 2>"$NIDER_HOST_ROOT/docker.stderr"
          NIDER_DOCKER_STATUS=$?
          printf '%s\n' "$NIDER_DOCKER_STATUS" >"$NIDER_HOST_ROOT/docker.status"
          if [ "$NIDER_DOCKER_STATUS" -ne 0 ]; then NIDER_HOST_FAIL=1; fi
          set -e
          exit "$NIDER_HOST_FAIL"
      - name: Run all 77 invented numerical reporting controls
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ulimit -f 1024
          NIDER_ROOT="/tmp/nider-arm64-admission-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          NIDER_SOURCE="$GITHUB_WORKSPACE/benchmarks/neuroscience/nider-reporting-controls-v1"
          test -d "$NIDER_ROOT"
          set +e
          /usr/bin/timeout --signal=TERM --kill-after=5s 35s python -I -S -B -c 'import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); b=p.read_bytes(); assert len(b)==int(sys.argv[2]) and hashlib.sha256(b).hexdigest()==sys.argv[3]; sys.argv=[str(p)]+sys.argv[4:]; exec(compile(b,str(p),"exec"),{"__name__":"__main__","__file__":str(p)})' "$NIDER_SOURCE/run_synthetic.py" 5604 05e59cece89041f12dad00d0fa421301017cfbd3afdbdfebbc391eba9c5e5476 --out "$NIDER_ROOT/artifact" >"$NIDER_ROOT/stdout.log" 2>"$NIDER_ROOT/stderr.log"
          NIDER_STATUS=$?
          set -e
          printf '%s\n' "$NIDER_STATUS" >"$NIDER_ROOT/exit-status.txt"
          exit "$NIDER_STATUS"
      - name: Preserve complete invented numerical evidence and original streams
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nider-arm64-admission-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          path: /tmp/nider-arm64-admission-${{ github.run_id }}-${{ github.run_attempt }}/

