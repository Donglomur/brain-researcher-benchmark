name: NIDER ARM64 clean dependency setup

on:
  push:
    branches:
      - publish/nider-arm64-clean-setup-20261114

permissions:
  contents: read

concurrency:
  group: nider-arm64-clean-setup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clean-dependency-setup:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.18'
      - name: Build and preserve only the locked dependency image
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          NIDER_SOURCE="$GITHUB_WORKSPACE/benchmarks/neuroscience/nider-arm64-owner-setup-v1"
          NIDER_OWNER="$RUNNER_TEMP/nider-clean-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          NIDER_CAPTURE="$RUNNER_TEMP/nider-clean-capture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python -I -S -B -c 'import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); b=p.read_bytes(); assert len(b)==int(sys.argv[2]) and hashlib.sha256(b).hexdigest()==sys.argv[3]; sys.argv=[str(p)]+sys.argv[4:]; exec(compile(b,str(p),"exec"),{"__name__":"__main__","__file__":str(p)})' "$NIDER_SOURCE/ci/observe_hosted.py" 8621 9f47f27a7869923ebdd1dcc4fb1c939a46b7763db419c14bfdb1c15ff4190ba7 "$NIDER_SOURCE" 796e7970f44d82aeec6f51feef3e0ddc7c9f1186b220995a0b7fec2ac0e565cd "$NIDER_OWNER" "$NIDER_CAPTURE"
      - name: Preserve audited dependency image and exact dependency-build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nider-dependency-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nider-clean-${{ github.run_id }}-${{ github.run_attempt }}/public_artifact/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
      - name: Preserve original outer command streams and status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nider-dependency-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nider-clean-capture-${{ github.run_id }}-${{ github.run_attempt }}/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
