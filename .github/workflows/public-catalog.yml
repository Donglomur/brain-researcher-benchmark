name: Public catalog and navigation

on:
  pull_request:
    branches: [publish/neuroscience-200]
  push:
    branches: [publish/neuroscience-200]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-catalog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-preflight:
    uses: ./.github/workflows/source-maintenance-preflight.yml
  public-catalog-and-navigation:
    name: public-catalog-and-navigation (shard ${{ matrix.shard }})
    needs: source-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.18'
      - name: Check deterministic catalog and source prerequisites
        if: matrix.shard == 0
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 90s python -I -S -B scripts/catalog.py --check
          timeout --signal=TERM --kill-after=5s 90s python -I -S -B scripts/maintenance/bind_paper_improvement.py --check
          timeout --signal=TERM --kill-after=5s 90s python -I -S -B scripts/maintenance/refresh_paper_integrity.py --check
          timeout --signal=TERM --kill-after=5s 90s python -I -S -B scripts/check_repository.py
      - name: Run assigned framework methods
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 600s python -I -S -B scripts/maintenance/run_framework_shard.py --expected-count 752 --shard-index "${{ matrix.shard }}"
      - name: Check remaining public interfaces
        if: matrix.shard == 0
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s python -B tests/test_paper_endpoint_selection.py
          timeout --signal=TERM --kill-after=5s 120s python -I -S -B tests/test_paper_retinal_paired_adoption.py --source-input-root .
          timeout --signal=TERM --kill-after=5s 90s python -I -S -B -m unittest discover -s tests/benchmarks -p 'test_*.py' -v
          timeout --signal=TERM --kill-after=5s 90s python -I -S -B -m unittest discover -s tests/maintenance -p 'test_*.py' -v
          python -I -S -B scripts/check_navigation.py
          bash -n examples/original-three/scripts/run_task.sh
